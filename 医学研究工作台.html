    downloadText('medresearch-backup-' + todayStr().replace(/-/g, '') + '-' + Date.now().toString(36) + '.json', JSON.stringify(payload, null, 2));
    toast('备份已导出');
  }
  async function importBackupFile(file) {
    var text = await file.text();
    var raw = safeJsonParse(text);
    var check = validateBackup(raw);
    if (!check.ok) {
      openModal({
        title: '备份格式校验失败',
        body: '<div class="banner bannerBad"><div class="grow"><b>未改动现有数据</b><br>' + check.problems.map(esc).join('<br>') + '</div></div>',
        hideSubmit: true
      });
      return;
    }
    var body = '<div class="banner bannerWarn"><div class="grow"><b>即将恢复备份</b><br>当前数据会先自动备份（如可用），然后用下列内容替换。</div></div>' +
      '<div class="kv"><div class="k">资料</div><div class="v">' + check.counts.items + ' 条</div><div class="k">专题</div><div class="v">' + check.counts.topics + ' 个</div><div class="k">笔记</div><div class="v">' + check.counts.notes + ' 条</div><div class="k">任务</div><div class="v">' + check.counts.tasks + ' 个</div><div class="k">病例</div><div class="v">' + check.counts.cases + ' 个</div><div class="k">导出时间</div><div class="v">' + esc(raw.exportedAt || raw.updatedAt || '未知') + '</div></div>' +
      '<label class="checkRow"><input type="checkbox" id="restoreConfirm" /> 我已确认要替换当前数据（会先备份当前文件）</label>';
    openModal({
      title: '从备份恢复',
      body: body,
      submitLabel: '确认恢复',
      onSubmit: async function () {
        if (!$('#restoreConfirm') || !$('#restoreConfirm').checked) { toast('请先勾选确认'); return false; }
        var normalized = normalizeState(raw);
        if (APP.bridge.online) {
          var r = await fetchJsonNice(APP.bridge.url + '/data/restore', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ data: normalized, confirm: true })
          }, 15000);
          if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || '恢复失败');
        } else {
          var current = JSON.stringify(APP.data, null, 2);
          downloadText('pre-restore-' + Date.now() + '.json', current);
          var file2 = dataFilePath();
          if (file2) {
            await fetchJsonNice('/api/worktable/write', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ path: file2, content: JSON.stringify(normalized, null, 2) }) }, 15000);
          }
        }
        APP.data = normalized;
        writeLocalState();
        setSaveMode(APP.bridge.online ? 'bridge' : (dataFilePath() ? 'worktable' : 'local'));
        applyFontSize();
        render();
        toast('已恢复备份（原数据已自动备份/导出）');
      }
    });
  }
  function clearDemoData() {
    var n = demoCount();
    if (!n) { toast('没有演示数据'); return; }
    if (!window.confirm('清除 ' + n + ' 条演示数据？真实资料、笔记、任务与病例不会被删除。')) return;
    APP.data.items = APP.data.items.filter(function (x) { return !x.demo; });
    APP.data.topics = APP.data.topics.filter(function (x) { return !x.demo; });
    APP.data.notes = APP.data.notes.filter(function (x) { return !x.demo; });
    APP.data.tasks = APP.data.tasks.filter(function (x) { return !x.demo; });
    APP.data.cases = APP.data.cases.filter(function (x) { return !x.demo; });
    var ids = {};
    APP.data.items.forEach(function (x) { ids[x.id] = 1; });
    var tids = {};
    APP.data.topics.forEach(function (x) { tids[x.id] = 1; });
    var cids = {};
    APP.data.cases.forEach(function (x) { cids[x.id] = 1; });
    APP.data.notes.forEach(function (n2) {
      if (n2.itemId && !ids[n2.itemId]) n2.itemId = '';
      if (n2.topicId && !tids[n2.topicId]) n2.topicId = '';
      if (n2.caseId && !cids[n2.caseId]) n2.caseId = '';
    });
    APP.data.items.forEach(function (it) { it.topicIds = it.topicIds.filter(function (id) { return tids[id]; }); });
    APP.data.tasks.forEach(function (t2) {
      if (t2.subjectType === 'item' && !ids[t2.subjectId]) { t2.subjectType = 'none'; t2.subjectId = ''; t2.subjectLabel = ''; }
      if (t2.subjectType === 'topic' && !tids[t2.subjectId]) { t2.subjectType = 'none'; t2.subjectId = ''; t2.subjectLabel = ''; }
      if (t2.subjectType === 'case' && !cids[t2.subjectId]) { t2.subjectType = 'none'; t2.subjectId = ''; t2.subjectLabel = ''; }
    });
    markDirty({ immediate: true });
    render();
    toast('演示数据已清除');
  }
  function addDemoData() {
    var seed = seedData();
    var existing = {};
    APP.data.items.forEach(function (x) { existing[x.id] = 1; });
    var added = 0;
    ['items', 'topics', 'notes', 'tasks', 'cases'].forEach(function (k) {
      seed[k].forEach(function (row) {
        if (!existing[row.id]) { APP.data[k].unshift(row); added++; }
      });
    });
    markDirty({ immediate: true });
    render();
    toast(added ? '已重新载入演示数据' : '演示数据已存在');
  }

<script>
/* ===== reader.js ===== */
  /* ================================================================

     ================================================================ */
  function readerItems() {
    var f = APP.ui.reader;
    var q = str(f.q).toLowerCase();
    return APP.data.items.filter(function (it) {
      if (f.filter === 'unread' && it.readStatus !== 'unread') return false;
      if (f.filter === 'reading' && it.readStatus !== 'reading') return false;
      if (f.filter === 'star' && !it.starred) return false;
      if (f.filter === 'pdf' && !it.filePath && !it.attachmentKey) return false;
      if (q && (it.title + ' ' + (it.authors || []).join(' ') + ' ' + it.journal).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) {
      return (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0) || b.addedAt - a.addedAt;
    });
  }
  function readerDocListHtml() {
    var list = readerItems();
    return '<div class="docList">' +
      '<div class="docListHead"><input class="input" id="readerQ" data-readerq placeholder="搜索阅读列表…" value="' + esc(APP.ui.reader.q) + '" /><div class="flex" style="margin-top:6px"><select class="select" data-readerfilter style="width:auto;height:26px;font-size:10.5px">' +
      [['all', '全部'], ['unread', '未读'], ['reading', '在读'], ['star', '收藏'], ['pdf', '有 PDF']].map(function (x) { return '<option value="' + x[0] + '"' + (APP.ui.reader.filter === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') +
      '</select><span class="muted">' + list.length + ' 篇</span></div></div>' +
      '<div class="docListScroll">' + (list.length ? list.map(function (it) {
        return '<div class="docItem ' + (it.id === READER.itemId ? 'docItemOn' : '') + '" data-act="readerSelect" data-id="' + it.id + '"><div class="t">' + (it.starred ? '★ ' : '') + esc(it.title) + '</div><div class="m">' + statusPill(it.readStatus) + ' ' + esc(it.year || '') + (it.filePath || it.attachmentKey ? ' · PDF' : ' · 题录') + '</div></div>';
      }).join('') : '<div class="empty">没有匹配的资料。</div>') + '</div></div>';
  }
  function readerStatusBadge() {
    if (READER.loading) return '<span class="statusChip warn"><span class="dot"></span>解析原文…</span>';

      return '<span class="statusChip ' + (hasText ? 'ok' : 'warn') + '"><span class="dot"></span>' + (hasText ? '已读取全文 · ' + READER.numPages + ' 页' : '已渲染 · 未提取到文本') + '</span>';
    }

    if (READER.status === 'error') return '<span class="statusChip bad"><span class="dot"></span>原文解析失败</span>';

  function renderReader() {

      html += '<div class="card">' + emptyBox('还没有选择要阅读的资料。', '<br><button class="btnMini" data-act="nav" data-section="library">去资料库选择</button>') + '</div></div>';

    html += '<aside class="readerAside">' + readerAsideHtml(item) + '</aside>';

  }
  function readerToolbarHtml(item) {

        '<input class="pageInput" id="pageInput" value="' + READER.page + '" aria-label="页码" />' +

        '<button class="btnMini" data-act="zoomOut" title="缩小">−</button><span class="muted">' + (READER.fit ? '适宽' : Math.round(READER.scale * 100) + '%') + '</span><button class="btnMini" data-act="zoomIn" title="放大">＋</button>' +

  /* ---------------- 打开与解析 PDF ---------------- */
  function resolvePdfUrl(item) {
    if (item.attachmentKey) {
      if (!bridgeIdentityMatches(APP.bridge.health) || APP.bridge.verifiedUrl !== APP.bridge.url) {
        throw new Error('本地文件服务尚未通过当前项目目录校验，请先启动或重试服务');
      }
      return APP.bridge.url + '/zotero/file?key=' + encodeURIComponent(item.attachmentKey);
    }
    var p = str(item.filePath);
    if (!p) return '';
    if (/^https?:/i.test(p)) return p;
    var abs = p;
    if (!/^[A-Za-z]:[\\/]/.test(p) && !/^\\\\/.test(p)) {
      var dir = projectDir();
      if (dir) abs = joinPath(dir, p.replace(/^[\\/]+/, '').split(/[\\/]/).join('/'));
    }
    return '/api/worktable/file?path=' + encodeURIComponent(abs);
  }
  function tryOpenReaderItem(id) {
    var item = findItem(id);
    if (!item) return;
    READER.loading = true;
    READER.status = 'idle';
    READER.error = '';
    render();
    if (item.attachmentKey || item.filePath) {
      loadPdf(item);
    } else if (item.fulltext) {
      READER.loading = false;
      READER.status = 'fulltext';
      READER.textChunks = chunksFromText(item.fulltext, null);
      render();
    } else {
      READER.loading = false;
      READER.status = 'abstract';
      READER.textChunks = item.abstract ? chunksFromText(item.abstract, '') : [];
      render();
    }
  }
  async function loadPdf(item) {
    var token = ++READER.docToken;
    READER.loading = true;
    READER.status = 'idle';
    READER.error = '';
    render();
    if (!window.pdfjsLib) {
      READER.loading = false;
      READER.status = 'error';
      READER.error = 'PDF.js 未加载（vendor/pdfjs/pdf.min.js）';
      render();
      return;
    }
    try {
      pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.js';
      if (!pdfjsLib.__medwbScalePatch) {
        var originalRenderTextLayer = pdfjsLib.renderTextLayer;
        pdfjsLib.renderTextLayer = function (params) {
          if (params && params.container && params.viewport) {
            params.container.style.setProperty('--scale-factor', String(params.viewport.scale));
          }
          return originalRenderTextLayer(params);
        };
        pdfjsLib.__medwbScalePatch = true;
      }
      var url = resolvePdfUrl(item);
      if (!url) throw new Error('没有可用的 PDF 地址');
      var loadingTask = pdfjsLib.getDocument({
        url: url,
        httpHeaders: bridgeRequestPath(url) ? { 'x-medresearch-project-root': encodeURIComponent(projectDir()) } : undefined,
        cMapUrl: './vendor/pdfjs/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: './vendor/pdfjs/standard_fonts/',
        disableRange: true,
        disableStream: true
      });
      var pdf = await loadingTask.promise;
      if (token !== READER.docToken) { try { pdf.destroy(); } catch (e) {} return; }
      READER.pdf = pdf;
      READER.numPages = pdf.numPages;
      READER.page = 1;
      READER.loading = false;
      READER.status = 'ready';
      READER.pageTextCache = {};
      READER.textChunks = [];
      render();
      await renderPdfPage(1, true);
      await buildChunksFromPdf();
      if (token === READER.docToken) render();
    } catch (err) {
      if (token !== READER.docToken) return;
      READER.loading = false;
      READER.status = 'error';
      READER.error = apiErrorMessage(err);
      render();
    }
  }
  async function renderPdfPage(pageNo, resetScroll) {
    if (!READER.pdf) return;
    var token = ++READER.renderToken;
    pageNo = clamp(pageNo, 1, READER.numPages);
    READER.page = pageNo;
    var page;
    try { page = await READER.pdf.getPage(pageNo); } catch (e) { return; }
    if (token !== READER.renderToken) return;
    var canvas = $('#pdfCanvas');
    var textLayer = $('#textLayer');
    var hlLayer = $('#hlLayer');
    if (!canvas || !textLayer) return;
    var base = page.getViewport({ scale: 1 });
    var stage = $('#pdfStage');
    var scale = READER.scale;
    if (READER.fit && stage) scale = Math.max(0.3, Math.min(3, (stage.clientWidth - 34) / base.width));
    READER.lastScale = scale;
    var viewport = page.getViewport({ scale: scale });
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);
    canvas.style.width = Math.floor(viewport.width) + 'px';
    canvas.style.height = Math.floor(viewport.height) + 'px';
    var ctx = canvas.getContext('2d', { alpha: false });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    try {
      await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    } catch (e) {}
    if (token !== READER.renderToken) return;
    textLayer.style.width = Math.floor(viewport.width) + 'px';
    textLayer.style.height = Math.floor(viewport.height) + 'px';
    textLayer.style.setProperty('--scale-factor', String(viewport.scale));
    document.documentElement.style.setProperty('--scale-factor', String(viewport.scale));
    var pageEl = $('#pdfPage');
    if (pageEl) {
      pageEl.style.width = Math.floor(viewport.width) + 'px';
      pageEl.style.height = Math.floor(viewport.height) + 'px';
      pageEl.style.setProperty('--scale-factor', String(viewport.scale));
    }
    textLayer.innerHTML = '';
    try {
      var tc = await page.getTextContent();
      if (token !== READER.renderToken) return;
      READER.pageTextCache[pageNo] = tc.items.map(function (it) { return it.str || ''; }).join(' ').replace(/\s+/g, ' ').trim();
      await pdfjsLib.renderTextLayer({ textContentSource: tc, container: textLayer, viewport: viewport, textDivs: [] }).promise;
    } catch (e) {
      /* 文本层失败时仍保留 canvas，阅读不中断 */
    }
    drawHighlights(pageNo);
    var input = $('#pageInput');
    if (input) input.value = pageNo;
    if (resetScroll) {
      var stageEl = $('#pdfStage');
      if (stageEl) stageEl.scrollTop = 0;
    }
  }
  function chunksFromText(text, page) {
    var clean = str(text);
    if (!clean) return [];
    var chunks = [];
    var size = 1600;
    for (var i = 0; i < clean.length; i += size) {
      var part = clean.slice(i, i + size).trim();
      if (part.length < 20) continue;
      chunks.push({ label: 'P' + (chunks.length + 1), page: page == null ? '' : String(page), text: part });
    }
    return chunks;
  }
  async function extractPageText(pageNo) {
    if (READER.pageTextCache[pageNo] != null) return READER.pageTextCache[pageNo];
    var page = await READER.pdf.getPage(pageNo);
    var tc = await page.getTextContent();
    var text = tc.items.map(function (it) { return it.str || ''; }).join(' ').replace(/\s+/g, ' ').trim();
    READER.pageTextCache[pageNo] = text;
    return text;
  }
  async function buildChunksFromPdf() {
    if (!READER.pdf) return;
    var chunks = [];
    var pages = Math.min(READER.numPages, 60);
    for (var p = 1; p <= pages; p++) {
      var text = '';
      try { text = await extractPageText(p); } catch (e) { continue; }
      if (!text || text.length < 20) continue;
      var pageParts = chunksFromText(text, p);
      pageParts.forEach(function (c) {
        chunks.push({ label: 'P' + (chunks.length + 1), page: c.page, text: c.text });
      });
      if (chunks.length >= 120) break;
    }
    READER.textChunks = chunks;
  }
  function reloadPdf() {
    var item = findItem(READER.itemId);
    if (!item) return;
    if (READER.pdf) { try { READER.pdf.destroy(); } catch (e) {} }
    READER.pdf = null;
    READER.textChunks = [];
    READER.pageTextCache = {};
    READER.status = 'idle';
    READER.loading = false;
    tryOpenReaderItem(item.id);
  }
  function openPdfFile() {
    var item = findItem(READER.itemId);
    if (!item) return;
    var url = resolvePdfUrl(item);
    if (!url) { toast('没有可打开的原文文件'); return; }
    window.open(url, '_blank', 'noopener');
  }
  function openPasteFulltextModal() {
    var item = findItem(READER.itemId);
    if (!item) return;
    var body = '<div class="banner"><div class="grow">粘贴你实际读到的全文（例如从出版社或机构订阅获得的文本）。只有粘贴后，问答才会把它当作依据；此操作不会自动上传到外部服务。</div></div>' +
      '<div class="field"><label>全文文本</label><textarea class="textarea" name="text" rows="12" placeholder="粘贴全文…">' + esc(item.fulltext || '') + '</textarea></div>';
    openModal({
      title: '粘贴原文全文',
      body: body,
      submitLabel: '保存全文',
      onSubmit: function (fd) {
        var text = str(fd.get('text'));
        if (text.length < 40) { toast('全文太短，请检查是否粘贴完整'); return false; }
        item.fulltext = text;
        item.updatedAt = Date.now();
        item.source = item.source || { type: 'manual', label: '手动粘贴全文', at: Date.now() };
        if (item.source.label === '手动登记') item.source.label = '手动登记 + 粘贴全文';
        READER.status = 'fulltext';
        READER.textChunks = chunksFromText(text, null);
        markDirty({ immediate: true });
        closeModal();
        render();
        toast('全文已保存，可用于本窗口问答');
      }

  /* ---------------- 页码 / 缩放 ---------------- */
  function pageStep(delta) {
    if (READER.status !== 'ready') return;
    var p = clamp(READER.page + delta, 1, READER.numPages);
    renderPdfPage(p, true);
    updatePageInput(p);
  }
  function goToPage(p) {
    if (READER.status !== 'ready') return;
    var n = clamp(parseInt(p, 10) || 1, 1, READER.numPages);
    renderPdfPage(n, true);
    updatePageInput(n);
  }
  function updatePageInput(p) {
    var input = $('#pageInput');
    if (input) input.value = p;
  }
  function zoomStep(delta) {
    if (READER.fit) READER.scale = READER.lastScale || READER.scale;
    READER.fit = false;
    READER.scale = clamp(Number((READER.scale + delta).toFixed(2)), 0.35, 3);
    renderPdfPage(READER.page, false);
    renderReaderToolbarOnly();
  }
  function toggleFit() {
    READER.fit = !READER.fit;
    renderPdfPage(READER.page, false);
    renderReaderToolbarOnly();
  }
  function renderReaderToolbarOnly() {
    var item = findItem(READER.itemId);
    if (!item) return;
    var host = $('.readerToolbar');
    if (!host) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = readerToolbarHtml(item);
    host.replaceWith(tmp.firstChild);
  }
  document.addEventListener('keydown', function (ev) {
    if (ev.target && ev.target.id === 'pageInput' && ev.key === 'Enter') {
      ev.preventDefault();
      goToPage(ev.target.value);
    }
    if (ev.target && ev.target.id === 'askInput' && ev.key === 'Enter') {
      ev.preventDefault();
      askPaperQuestion();
    }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target.matches('[data-readerfilter]')) {
      APP.ui.reader.filter = ev.target.value;
      render();

  /* ---------------- 选择、批注、笔记 ---------------- */
  function hideSelectionBar() {

      '<div class="formGrid"><div class="field"><label>表图号（可选）</label><input class="input" name="sourceRef" placeholder="例如 图 2 / 表 1" /></div>' +
      '<div class="field"><label>颜色</label><select class="select" name="color"><option value="#ffd600">黄色</option><option value="#4f8ef7">蓝色</option><option value="#3fb950">绿色</option><option value="#f85149">红色</option></select></div></div>' +
      '<div class="hint">保存后会记录第 ' + esc(sel.page) + ' 页与选中文本；若文本层无法定位，批注仍保留在列表中，但不会假装有高亮位置。</div>';
    openModal({

  function explainSelection() {

  }
  function drawHighlights(pageNo) {
    var layer = $('#hlLayer');
    var textLayer = $('#textLayer');
    var item = findItem(READER.itemId);
    if (!layer || !textLayer || !item) return;
    layer.innerHTML = '';
    var anns = (item.annotations || []).filter(function (a) { return String(a.page) === String(pageNo); });
    anns.forEach(function (a) {
      var range = findQuoteRange(textLayer, a.quote);
      if (!range) return;
      var base = textLayer.getBoundingClientRect();
      var rects = range.getClientRects();
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (!r.width || !r.height) continue;
        var d = document.createElement('div');
        d.className = 'hlRect';
        d.style.left = (r.left - base.left) + 'px';
        d.style.top = (r.top - base.top) + 'px';
        d.style.width = r.width + 'px';
        d.style.height = r.height + 'px';
        d.style.background = a.color || '#ffd600';
        d.title = a.comment || '批注';
        d.setAttribute('data-act', 'locateAnnotation');
        d.setAttribute('data-id', a.id);
        layer.appendChild(d);
      }
    });
  }
  function findQuoteRange(root, quote) {
    var needle = str(quote).replace(/\s+/g, ' ').trim();
    if (!needle) return null;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    var full = '';
    var node;
    while ((node = walker.nextNode())) {
      if (!node.nodeValue) continue;
      nodes.push({ node: node, start: full.length });
      full += node.nodeValue;
    }
    var idx = full.indexOf(needle);
    if (idx < 0) {
      var compact = full.replace(/\s+/g, ' ');
      var cidx = compact.indexOf(needle);
      if (cidx < 0) {
        var shortNeedle = needle.slice(0, Math.min(60, needle.length));
        idx = full.indexOf(shortNeedle);
        if (idx < 0) return null;
        needle = shortNeedle;
      } else {
        return null;
      }
    }
    var end = idx + needle.length;
    function locate(offset) {
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        var len = n.node.nodeValue.length;
        if (offset >= n.start && offset <= n.start + len) return { node: n.node, offset: offset - n.start };
      }
      return null;
    }
    var s = locate(idx);
    var e = locate(end);
    if (!s || !e) return null;
    try {
      var r = document.createRange();
      r.setStart(s.node, s.offset);
      r.setEnd(e.node, e.offset);
      return r;
    } catch (err) { return null; }
  }
  function locateAnnotation(id) {
    var item = findItem(READER.itemId);
    if (!item) return;
    var ann = (item.annotations || []).filter(function (a) { return a.id === id; })[0];
    if (!ann) return;
    if (READER.status === 'ready' && ann.page && parseInt(ann.page, 10) !== READER.page) {
      renderPdfPage(parseInt(ann.page, 10), true).then(function () {

      });

  }
  function flashAnnotation(id) {
    var rects = $$('.hlRect[data-id="' + id + '"]');
    if (!rects.length) { toast('当前页文本层无法精确定位这段原文'); return; }

  /* ---------------- 单篇问答 ---------------- */
  function tokenize(q) {
    var out = {};
    String(q || '').toLowerCase().replace(/[a-z0-9]{3,}/g, function (m) { out[m] = 1; return m; });
    var cjk = String(q || '').match(/[\u4e00-\u9fa5]{2,}/g) || [];
    cjk.forEach(function (seg) {
      for (var i = 0; i < seg.length - 1; i++) out[seg.slice(i, i + 2)] = 1;
    });
    return Object.keys(out);
  }
  function scoreChunks(question, chunks) {
    var terms = tokenize(question);
    return chunks.map(function (c) {
      var text = c.text.toLowerCase();
      var score = 0;
      terms.forEach(function (t) { if (text.indexOf(t) >= 0) score += t.length >= 4 ? 3 : 2; });
      return { chunk: c, score: score };
    }).sort(function (a, b) { return b.score - a.score; });
  }
  function selectChunks(question, chunks) {
    if (!chunks.length) return [];
    var scored = scoreChunks(question, chunks);
    var picked = [];
    var seen = {};
    scored.forEach(function (s) {
      if (picked.length >= 10) return;
      if (s.score <= 0 && picked.length >= 3) return;
      if (seen[s.chunk.label]) return;
      seen[s.chunk.label] = 1;
      picked.push(s.chunk);
    });
    if (picked.length < 4) {
      for (var i = 0; i < chunks.length && picked.length < 4; i++) {
        if (!seen[chunks[i].label]) { picked.push(chunks[i]); seen[chunks[i].label] = 1; }
      }
    }
    return picked;
  }
  function currentChunks() {
    if (READER.textChunks.length) return READER.textChunks;
    var item = findItem(READER.itemId);
    if (!item) return [];
    if (item.fulltext) return chunksFromText(item.fulltext, null);
    if (item.abstract) return chunksFromText(item.abstract, '');
    return [];
  }
  function answerCitations(answer, chunks) {
    var byLabel = {};
    chunks.forEach(function (c) { byLabel[String(c.label)] = c; });
    var seen = {};
    var citations = [];
    var invalid = [];
    var text = String(answer || '');
    var re = /\[([A-Za-z]\d{1,3})\]/g;
    var m;
    while ((m = re.exec(text))) {
      var label = m[1];
      var chunk = byLabel[label];
      if (!chunk) {
        if (invalid.indexOf(label) < 0) invalid.push(label);
        continue;
      }
      if (seen[label]) continue;
      seen[label] = 1;
      citations.push({ label: label, page: chunk.page || '', preview: truncate(chunk.text, 120) });
    }
    return { citations: citations, invalid: invalid, grounded: citations.length > 0 && invalid.length === 0 };
  }
  async function askPaperQuestion() {
    var input = $('#askInput');
    if (!input) return;
    var q = str(input.value);
    if (!q) { toast('请输入问题'); return; }
    input.value = '';
    await askPaper(q, 'qa');
  }
  async function askPaper(question, mode, quote, quotePage) {
    var item = findItem(READER.itemId);
    if (!item) return;
    var chunks = currentChunks();
    if (mode === 'explain' && quote) {
      var all = chunks.slice();
      var page = quotePage || (READER.selection ? READER.selection.page : '');
      var first = all.filter(function (c) { return String(c.page) === String(page); })[0];
      chunks = [{ label: 'X1', page: page || '', text: quote }].concat(first ? [first] : []).concat(selectChunks(question, all).slice(0, 4));
    } else {
      chunks = selectChunks(question, chunks);
    }
    if (!chunks.length) {
      var note = READER.status === 'abstract'
        ? '当前只有摘要，无法基于全文回答。你可以先粘贴全文，或把问题交给原生会话。'
        : READER.status === 'error'
          ? '原文解析失败，没有可用的原文片段。'
          : '尚未读取到可用的原文文本（可能是扫描版 PDF）。请粘贴全文后重试。';
      READER.qaError = note;
      render();
      toast(note);
      return;
    }
    READER.qaBusy = true;
    READER.qaError = '';
    APP.ui.reader.tab = 'qa';
    render();
    var result = null;
    var errMsg = '';
    try {
      result = await askHostModel({
        question: question,
        itemTitle: item.title,
        chunks: chunks.map(function (c) { return { label: c.label, page: c.page, text: c.text }; }),
        kind: mode === 'explain' ? 'explain' : 'qa'
      });
    } catch (err) {
      errMsg = '模型请求失败：' + apiErrorMessage(err) + '。已改为本地原文片段检索。';
    }
    READER.qaBusy = false;
    if (result && result.answer) {
      var cite = answerCitations(result.answer, chunks);
      var row = {
        id: uid('qa'),
        question: question,
        answer: result.answer,
        citations: cite.citations,
        grounded: cite.grounded,
        origin: 'ai',
        provider: result.provider || '',
        providerLabel: result.providerLabel || result.provider || '',
        model: result.model || '',
        mode: result.mode || '',
        source: result.source || '',
        truncated: !!result.truncated,
        finishReason: result.finishReason || '',
        notice: result.notice || (result.truncated ? '回答被截断（' + (result.finishReason || 'max-tokens') + '）' : ''),
        configNote: cite.invalid.length ? '模型返回了无效引用：' + cite.invalid.join(', ') : '',
        createdAt: Date.now()
      };
      item.qa = (item.qa || []).concat(row).slice(-30);
      item.updatedAt = Date.now();
      markDirty({ immediate: true });
      render();
      if (errMsg) toast(errMsg);
      return;
    }
    // 无模型 / 模型失败：只做本地检索，不伪造 AI 回答。
    var scored = scoreChunks(question, chunks).slice(0, 3).filter(function (s) { return s.score > 0; });
    if (!scored.length) scored = chunks.slice(0, 2).map(function (c) { return { chunk: c, score: 0 }; });
    var answer = '未调用模型（' + (result && result.message ? result.message : errMsg || '模型未配置') + '）。\n\n以下是从已读取内容中按词项重合检索到的原文片段，请自行核对：\n\n' +
      scored.map(function (s) {
        return '[' + s.chunk.label + '] ' + (s.chunk.page ? '第 ' + s.chunk.page + ' 页：' : '') + truncate(s.chunk.text, 380);
      }).join('\n\n');
    item.qa = (item.qa || []).concat({
      id: uid('qa'),
      question: question,
      answer: answer,
      citations: scored.map(function (s) { return { label: s.chunk.label, page: s.chunk.page, preview: truncate(s.chunk.text, 120) }; }),
      grounded: false,
      origin: 'local',
      configNote: '未调用模型',
      createdAt: Date.now()
    }).slice(-30);
    item.updatedAt = Date.now();
    markDirty();
    render();
  }
  function setAskInput(text) {
    APP.ui.reader.tab = 'qa';
    render();
    var input = $('#askInput');
    if (input) { input.value = text; input.focus(); }
  }

  /* ---------------- 交给原生会话 ---------------- */
  function buildReaderPack(item) {
    var chunks = currentChunks();
    var top = chunks.slice(0, 6);
    var notes = notesFor({ itemId: item.id }).slice(0, 6);
    var anns = (item.annotations || []).slice(-6);
    var md = '# 文献阅读交接单（医学研究工作台）\n\n' +
      '- 标题：' + item.title + '\n' +
      '- 作者：' + (item.authors.join(', ') || '未提供') + '\n' +
      '- 期刊/年份：' + (item.journal || '未提供') + ' · ' + (item.year || '未提供') + '\n' +
      '- DOI：' + (item.doi || '未提供') + '\n' +
      '- PMID：' + (item.pmid || '未提供') + '\n' +
      '- 阅读状态：' + READ_STATUS[item.readStatus] + '\n' +
      '- 已读取内容：' + (READER.status === 'ready' ? 'PDF 全文 ' + READER.numPages + ' 页（本窗口提取）' : READER.status === 'abstract' ? '仅摘要' : READER.status === 'fulltext' ? '粘贴/索引全文' : '未读取全文') + '\n\n' +
      '## 原文片段（仅这些内容可被引用）\n\n' +
      (top.length ? top.map(function (c) { return '[' + c.label + ']' + (c.page ? ' 第 ' + c.page + ' 页' : '') + '\n' + truncate(c.text, 900); }).join('\n\n') : '（无可用片段）') + '\n\n' +
      '## 我的笔记\n\n' + (notes.length ? notes.map(function (n) { return '- ' + (n.sourcePage ? '[第 ' + n.sourcePage + ' 页] ' : '') + n.body; }).join('\n') : '（无）') + '\n\n' +
      '## 批注\n\n' + (anns.length ? anns.map(function (a) { return '- 第 ' + (a.page || '?') + ' 页' + (a.sourceRef ? '（' + a.sourceRef + '）' : '') + '：“' + a.quote + '” ' + (a.comment || ''); }).join('\n') : '（无）') + '\n\n' +
      '请只依据上面的片段继续讨论；无法从片段确认的内容请明确说明，不要补写页码或引文。';
    return md;
  }
  function sendReaderToNative() {
    var item = findItem(READER.itemId);
    if (!item) return;
    var pack = buildReaderPack(item);
    var embedded = !!findNativeComposer();
    var body = '<div class="banner"><div class="grow">' + (embedded
      ? '检测到同一 DSH 窗口的原生输入框。点击下方按钮会把整理稿放入输入框，<b>不会自动发送</b>；你可以在发送前检查、修改或删除。'
      : '当前不在 DSH 原生窗口内（或未找到输入框）。点击按钮会复制整理稿；你可粘贴到原生会话，是否发送由你决定。') + '</div></div>' +
      '<div class="field"><label>交接稿预览</label><textarea class="textarea" rows="12" readonly>' + esc(pack) + '</textarea></div>';
    openModal({
      title: '交给原生会话',
      body: body,
      submitLabel: embedded ? '放入原生草稿（不发送）' : '复制整理稿',
      onSubmit: async function () {
        var res = await putNativeDraft(pack);
        if (res.ok) {
          toast('已放入原生输入框，请检查后自行发送（未自动发送）。');
          return true;
        }
        var ok = res.copied;
        if (!ok) ok = await copyText(pack);
        if (!embedded) {
          try { window.open('/', '_blank', 'noopener'); } catch (e) {}
        }
        toast(ok ? '未找到可写入的原生输入框，已复制交接稿；请粘贴到原生会话。' : '复制失败，请手动选择上方文本复制');
        return true;
      }
    });
  }

  /* ---------------- 选读列表切换 ---------------- */
  function setReaderTabFromAction(tab) {
    APP.ui.reader.tab = tab;
    render();
  }

  async function runSearch() {

      APP.ui.search.yearTo = str(form.yearTo);

    } else if (tab === 'trials') {
      APP.ui.search.condition = str(form.condition);
      APP.ui.search.intervention = str(form.intervention);
      if (!APP.ui.search.condition) { toast('请输入疾病或适应症'); return; }
    } else {
      APP.ui.search.drug = str(form.query);

    }

    try {
      var result;
      if (APP.bridge.online) {
        result = await runSearchViaBridge(tab, form);
      } else {
        result = await runSearchDirect(tab, form);
      }
      var label = result.queryLabel || (typeof result.query === 'string' ? result.query : '');
      APP.search.results[tab] = result.items;
      APP.search.meta[tab] = {
        source: result.source,
        at: Date.now(),
        query: label,
        total: result.total,
        returnedCount: result.items.length,
        fallback: result.fallback || null,
        complete: result.complete,
        note: result.note || ''

      recordSearch(tab, label, result.params || form, result.items.length, result.source);
      APP.search.loading = false;
      render();
    } catch (err) {
      APP.search.loading = false;
      var msg = apiErrorMessage(err);
      if (/Failed to fetch|NetworkError|Load failed|network error/i.test(msg)) {
        msg = '无法连接本地服务或网络不可达。请启动本地服务、检查网络后重试；已保留本次查询条件。';

  async function runSearchViaBridge(tab, form) {

      payload = { query: APP.ui.search.q, mindate: form.yearFrom, maxdate: form.yearTo, limit: form.limit, sort: form.sort };
    } else if (tab === 'trials') {
      payload = { condition: form.condition, intervention: form.intervention, phase: form.phase, status: form.trialStatus, limit: form.limit };
    } else {

    var r = await fetchJsonNice(APP.bridge.url + url, {

  /* ---------------- 直连上游（无桥接时的兜底） ---------------- */
  async function directFetch(url, options, timeoutMs) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs || 30000);
    try {
      var r = await fetch(url, Object.assign({}, options, { signal: controller.signal }));
      var text = await r.text();
      if (r.status === 429) throw new Error('上游限速（429），请稍后重试');
      if (!r.ok) throw new Error('上游返回 HTTP ' + r.status);
      return text;
    } catch (err) {
      if (err.name === 'AbortError') throw new Error('请求超时（可能是网络不可达）');
      if (/Failed to fetch|Load failed/i.test(err.message)) throw new Error('网络请求失败：可能是断网或浏览器拦截了跨域请求');
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }
  function xmlText(el) {

    }
    var retmax = clamp(parseInt(form.limit, 10) || 10, 1, 30);
    var searchParams = new URLSearchParams({
      db: 'pubmed',
      term: parts.join(' AND '),
      retmode: 'json',
      retmax: String(retmax),
      sort: form.sort === 'date' ? 'pub_date' : 'relevance',
      tool: 'dsh-medresearch-workbench-page'
    });
    var searchText = await directFetch('https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?' + searchParams.toString(), {}, 25000);
    var searchJson = safeJsonParse(searchText);
    if (!searchJson || !searchJson.esearchresult) throw new Error('PubMed 返回无法解析');
    var ids = searchJson.esearchresult.idlist || [];
    var total = Number(searchJson.esearchresult.count || 0);
    if (!ids.length) return { source: 'PubMed（页面直连）', query: term, queryLabel: term, total: 0, items: [] };
    var fetchParams = new URLSearchParams({ db: 'pubmed', id: ids.join(','), retmode: 'xml', tool: 'dsh-medresearch-workbench-page' });

    var articles = Array.prototype.slice.call(doc.getElementsByTagName('PubmedArticle'));
    var items = articles.map(function (a) {
      var pmid = xmlText(a.getElementsByTagName('PMID')[0]);
      var title = xmlText(a.getElementsByTagName('ArticleTitle')[0]);
      var journal = xmlText(a.getElementsByTagName('Title')[0]);
      var year = '';
      var pubDate = a.getElementsByTagName('PubDate')[0];
      if (pubDate) {
        var y = pubDate.getElementsByTagName('Year')[0];
        var md = pubDate.getElementsByTagName('MedlineDate')[0];
        year = y ? xmlText(y) : (md ? (xmlText(md).match(/\d{4}/) || [''])[0] : '');
      }
      var authors = Array.prototype.slice.call(a.getElementsByTagName('Author')).map(function (au) {
        var last = xmlText(au.getElementsByTagName('LastName')[0]);
        var first = xmlText(au.getElementsByTagName('ForeName')[0]);
        var col = xmlText(au.getElementsByTagName('CollectiveName')[0]);

      var abstractParts = Array.prototype.slice.call(a.getElementsByTagName('AbstractText')).map(function (ab) {
        var label = ab.getAttribute('Label');

      }).filter(Boolean);
      var doi = '';
      var idsEls = Array.prototype.slice.call(a.getElementsByTagName('ArticleId'));
      idsEls.forEach(function (idEl) { if (idEl.getAttribute('IdType') === 'doi') doi = xmlText(idEl); });
      if (!doi) {
        var eloc = Array.prototype.slice.call(a.getElementsByTagName('ELocationID'));
        eloc.forEach(function (e) { if (e.getAttribute('EIdType') === 'doi') doi = xmlText(e); });
      }
      var pmc = '';
      idsEls.forEach(function (idEl) { if (idEl.getAttribute('IdType') === 'pmc') pmc = xmlText(idEl); });
      return {
        pmid: pmid,
        title: title || '(未取到标题)',
        authors: authors,
        journal: journal,
        year: year,
        date: year,
        abstract: abstractParts.join('\n\n'),
        doi: doi,
        pmc: pmc,
        url: 'https://pubmed.ncbi.nlm.nih.gov/' + pmid + '/'
      };
    });
    return { source: 'PubMed（页面直连）', query: term, queryLabel: term, total: total, items: items };
  }
  async function directTrials(form) {
    var params = new URLSearchParams();
    params.set('query.cond', form.condition);
    if (form.intervention) params.set('query.intr', form.intervention);
    if (form.phase) params.set('filter.phase', form.phase);
    if (form.trialStatus) params.set('filter.overallStatus', form.trialStatus);
    params.set('pageSize', String(clamp(parseInt(form.limit, 10) || 10, 1, 30)));
    params.set('fields', 'NCTId,BriefTitle,OfficialTitle,OverallStatus,Phase,LeadSponsorName,CollaboratorName,StartDate,LastUpdatePostDate,PrimaryCompletionDate,EnrollmentCount,EnrollmentType,Condition,InterventionName,InterventionType,BriefSummary,PrimaryOutcomeMeasure');
    var text = await directFetch('https://clinicaltrials.gov/api/v2/studies?' + params.toString(), {}, 30000);
    var j = safeJsonParse(text);
    if (!j) throw new Error('ClinicalTrials.gov 返回无法解析');
    var studies = j.studies || [];
    var items = studies.map(function (study) {
      var p = study.protocolSection || {};
      var id = p.identificationModule || {};
      var st = p.statusModule || {};
      var des = p.designModule || {};
      var sp = p.sponsorCollaboratorsModule || {};
      var cond = p.conditionsModule || {};
      var arms = p.armsInterventionsModule || {};
      var desc = p.descriptionModule || {};
      return {
        nctId: id.nctId || '',
        title: id.briefTitle || id.officialTitle || '(未取到标题)',
        status: st.overallStatus || '',
        statusLabel: (function (s) {
          return { RECRUITING: '招募中', NOT_YET_RECRUITING: '尚未招募', ACTIVE_NOT_RECRUITING: '进行中（不招募）', COMPLETED: '已完成', ENROLLING_BY_INVITATION: '邀请入组', SUSPENDED: '暂停', TERMINATED: '终止', WITHDRAWN: '撤回', UNKNOWN: '未知' }[s] || s || '';
        })(st.overallStatus),
        phase: (des.phases || []).join(' / '),
        sponsor: (sp.leadSponsor && sp.leadSponsor.name) || '',
        startDate: (st.startDateStruct && st.startDateStruct.date) || '',
        lastUpdate: (st.lastUpdatePostDateStruct && st.lastUpdatePostDateStruct.date) || '',
        enrollment: (des.enrollmentInfo && des.enrollmentInfo.count) || '',
        conditions: cond.conditions || [],
        interventions: (arms.interventions || []).map(function (x) { return [x.name, x.type].filter(Boolean).join(' / '); }),
        summary: desc.briefSummary || '',
        url: 'https://clinicaltrials.gov/study/' + (id.nctId || '')
      };
    });
    return { source: 'ClinicalTrials.gov API v2（页面直连）', query: form.condition, queryLabel: [form.condition, form.intervention].filter(Boolean).join(' / '), total: Number(j.totalCount || items.length), items: items };
  }
  async function directDrug(name) {
    var warnings = [];
    var hits = null;
    try {
      var q = new URLSearchParams({ q: name, size: '3', fields: 'chembl.pref_name,chembl.molecule_chembl_id,chembl.max_phase,drugbank.name,drugbank.drugbank_id,pubchem.iupac.name.all,unii.name,ginas.name,inchikey' });
      var t1 = await directFetch('https://mychem.info/v1/query?' + q.toString(), {}, 25000);
      var j1 = safeJsonParse(t1);
      hits = j1 && j1.hits;
    } catch (e) { warnings.push('MyChem.info：' + e.message); }
    var label = null;
    try {
      var fp = new URLSearchParams({ search: 'openfda.generic_name:"' + name.replace(/"/g, '') + '"', limit: '10' });
      var t2 = await directFetch('https://api.fda.gov/drug/label.json?' + fp.toString(), {}, 25000);
      var j2 = safeJsonParse(t2);
      if (j2 && j2.results && j2.results.length) {
        var needle = name.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        var best = null, bestScore = -1;
        j2.results.forEach(function (lab) {
          var names = ((lab.openfda && lab.openfda.generic_name) || []).concat((lab.openfda && lab.openfda.brand_name) || []);
          var score = 0;
          names.forEach(function (raw) {
            var g = raw.toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
            if (g === needle) score = Math.max(score, 100);
            else if (g.indexOf(needle + ' ') === 0 || g.lastIndexOf(' ' + needle) === g.length - needle.length - 1) score = Math.max(score, 60);
            else if (g.indexOf(needle) >= 0) score = Math.max(score, 20);
          });
          score -= Math.min(names.length, 5);
          if (score > bestScore) { best = lab; bestScore = score; }
        });
        label = best;
        if (best && bestScore < 60) warnings.push('openFDA 未找到与“' + name + '”完全对应的单一成分说明书；当前为含该成分的组合/复方说明书，请核对成分与适应症。');
      }
    } catch (e) { warnings.push('openFDA：' + e.message); }
    var first = (hits && hits[0]) || {};
    var names = [first.chembl && first.chembl.pref_name, first.drugbank && first.drugbank.name].filter(Boolean);
    var identifiers = [];
    if (first.chembl && first.chembl.molecule_chembl_id) identifiers.push(['ChEMBL', first.chembl.molecule_chembl_id]);
    if (first.drugbank && first.drugbank.drugbank_id) identifiers.push(['DrugBank', first.drugbank.drugbank_id]);
    if (first.unii && first.unii.name) identifiers.push(['UNII', first.unii.name]);
    if (first.inchikey) identifiers.push(['InChIKey', first.inchikey]);
    var sectionDefs = [['boxed_warning', '黑框警告'], ['indications_and_usage', '适应症'], ['dosage_and_administration', '用法用量'], ['contraindications', '禁忌'], ['warnings', '警告与注意事项'], ['adverse_reactions', '不良反应'], ['drug_interactions', '药物相互作用'], ['use_in_specific_populations', '特殊人群'], ['pregnancy', '妊娠'], ['pediatric_use', '儿科使用'], ['geriatric_use', '老年使用'], ['overdosage', '过量'], ['description', '药物描述']];
    var sections = [];
    if (label) {
      sectionDefs.forEach(function (sd) {
        var v = label[sd[0]];
        var text = Array.isArray(v) ? v.join('\n') : (v || '');
        if (text) sections.push({ key: sd[0], heading: sd[1], text: String(text).slice(0, 1200) });
      });
    }
    return {
      source: 'MyChem.info + openFDA（页面直连）',
      query: name,
      queryLabel: name,
      total: sections.length ? 1 : 0,
      items: [{
        query: name,
        names: names,
        identifiers: identifiers,
        label: label ? {
          region: '美国',
          agency: 'FDA（openFDA 药品说明书）',
          effectiveTime: (function () { var r = String(label.effective_time || ''); return /^\d{8}$/.test(r) ? r.slice(0, 4) + '-' + r.slice(4, 6) + '-' + r.slice(6, 8) : r; })(),
          genericNames: (label.openfda && label.openfda.generic_name) || [],
          manufacturer: (label.openfda && label.openfda.manufacturer_name) || [],
          sections: sections
        } : null,
        warnings: warnings,
        links: [
          ['DailyMed 说明书检索', 'https://dailymed.nlm.nih.gov/dailymed/search.cfm?labeltype=all&query=' + encodeURIComponent(name)],
          ['PubChem 化合物', 'https://pubchem.ncbi.nlm.nih.gov/#query=' + encodeURIComponent(name)]
        ],
        coverageNote: '当前仅整合美国 FDA 说明书与化学标识；中国 NMPA 说明书、适应症差异与可及性未覆盖，临床使用前请查阅国家药监局批准的现行说明书。'
      }]
    };
  }

  function searchResultToItem(kind, row) {
    var now = Date.now();
    if (kind === 'lit') {
      return {
        title: row.title,
        type: '期刊文献',
        authors: row.authors || [],
        year: row.year || '',
        journal: row.journal || '',
        doi: row.doi || '',
        pmid: row.pmid || '',
        pmc: row.pmc || '',
        abstract: row.abstract || '',
        url: row.url || '',
        tags: [],
        source: { type: 'pubmed', label: 'PubMed 检索', at: now },
        extra: { retrievedAt: now, query: APP.search.meta.lit && APP.search.meta.lit.query }
      };
    }
    if (kind === 'trial') {
      return {
        title: row.title,
        type: '临床试验',
        abstract: row.summary || '',
        url: row.url || '',
        tags: [row.nctId].filter(Boolean),
        source: { type: 'trial', label: 'ClinicalTrials.gov', at: now },
        extra: {
          nctId: row.nctId, status: row.status, statusLabel: row.statusLabel, phase: row.phase,
          sponsor: row.sponsor, startDate: row.startDate, lastUpdate: row.lastUpdate,
          enrollment: row.enrollment, conditions: row.conditions, interventions: row.interventions
        }
      };
    }
    var label = row.label;
    var sections = label ? label.sections : [];
    return {
      title: ((row.names && row.names[0]) || row.query || '药物资料') + ' · 药物资料',
      type: '药物资料',
      abstract: sections.length ? sections.map(function (s) { return s.heading + '：' + s.text; }).join('\n\n') : (row.coverageNote || ''),
      url: (row.links && row.links[0] && row.links[0][1]) || '',
      tags: (row.identifiers || []).map(function (x) { return x[0] + ':' + x[1]; }),
      source: { type: 'drug', label: 'MyChem.info + openFDA', at: now },
      extra: { identifiers: row.identifiers, labelRegion: label && label.region, agency: label && label.agency, effectiveTime: label && label.effectiveTime, coverageNote: row.coverageNote }
    };
  }
  function addSearchResult(kind, index) {
    var rows = APP.search.results[APP.ui.search.tab];

        var topicId = str(fd.get('topicId'));

    html += '<div class="card"><div class="cardHead"><h3>相关资料（' + items.length + '）</h3><button class="btnMini" data-act="caseLinkItem">＋ 关联</button></div>' +
      (items.length ? items.map(function (it) {
        return '<div class="noteCard"><div class="b" style="font-size:11.5px">' + esc(it.title) + '</div><div class="f"><span class="chip">' + esc(it.type) + '</span><span class="chip chipKey mono">' + esc(it.pmid ? 'PMID ' + it.pmid : it.doi ? 'DOI ' + it.doi : '') + '</span><button class="btnMini" data-act="read" data-id="' + it.id + '">阅读</button><button class="btnMini btnMiniDanger" data-act="caseUnlinkItem" data-item="' + it.id + '">移除</button></div></div>';
      }).join('') : '<div class="muted">还没有关联文献。可把研究问题关联到资料库中的证据。</div>') + '</div>';
    html += '<div class="card"><div class="cardHead"><h3>病例笔记（' + notes.length + '）</h3><button class="btnMini" data-act="caseNoteNew" data-id="' + c.id + '">＋ 笔记</button></div>' +
      (notes.length ? notes.map(function (n) { return noteCardHtml(n); }).join('') : '<div class="muted">还没有病例笔记。</div>') + '</div>';
    html += '<div class="card"><div class="cardHead"><h3>关联任务（' + tasks.length + '）</h3><button class="btnMini" data-act="taskNew" data-subject="case" data-subjectid="' + c.id + '" data-subjectlabel="' + esc(c.title) + '">＋ 任务</button></div>' +
      (tasks.length ? tasks.map(taskCardHtml).join('') : '<div class="muted">还没有任务。</div>') + '</div>';
    html += '<div class="card"><div class="cardHead"><h3>隐私与边界</h3></div><div class="sub">· 本窗口不会把病例自动发送到外部检索或模型；<br>· 「交给原生会话」会把下方整理稿复制到剪贴板，是否发送由你决定；<br>· AI 输出仅供研究与讨论，不替代执业医师对患者的直接评估。</div></div>';
    html += '</aside></div></div>';
    return html;
  }
  function collectCaseForm() {
    var c = findCase(APP.route.caseId);
    if (!c) return null;
    document.querySelectorAll('[data-casefield]').forEach(function (el) {
      var key = el.getAttribute('data-casefield');
      if (key === 'code') c.code = str(el.value) || c.code;
      else if (key === 'title') c.title = str(el.value) || '未命名病例';
      else c[key] = str(el.value);
    });
    c.updatedAt = Date.now();
    return c;
  }
  function saveCaseForm() {
    var c = collectCaseForm();
    if (!c) return;
    markDirty({ immediate: true });
    render();
    toast('病例已保存');
  }
  function flushCaseForm() {
    if (APP.section !== 'cases' || !APP.route.caseId) return;
    var c = collectCaseForm();
    if (c) markDirty({ immediate: true });
  }
  var caseSaveTimer = null;
  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (!el.matches || !el.matches('[data-casefield]')) return;
    clearTimeout(caseSaveTimer);
    caseSaveTimer = setTimeout(function () {
      var c = collectCaseForm();
      if (!c) return;
      markDirty();
    }, 600);
  });
  function deleteCase(id) {
    var c = findCase(id);
    if (!c) return;
    if (!window.confirm('删除病例「' + c.title + '」？关联笔记与任务会保留，但不再关联此病例。')) return;
    APP.data.cases = APP.data.cases.filter(function (x) { return x.id !== id; });
    APP.data.notes.forEach(function (n) { if (n.caseId === id) n.caseId = ''; });
    APP.data.tasks.forEach(function (t) { if (t.subjectType === 'case' && t.subjectId === id) { t.subjectType = 'none'; t.subjectId = ''; } });
    if (APP.route.caseId === id) APP.route.caseId = '';
    markDirty({ immediate: true });
    render();
    toast('病例已删除');
  }
  function openCaseItemPicker() {
    var c = findCase(APP.route.caseId);
    if (!c) return;
    var options = APP.data.items.filter(function (it) { return c.itemIds.indexOf(it.id) < 0; });
    if (!options.length) { toast('资料库中没有可关联的其他资料'); return; }
    var body = '<div class="field"><label>选择要关联的资料</label><select class="select" name="itemId">' + options.map(function (it) { return '<option value="' + it.id + '">' + esc(truncate(it.title, 90)) + '</option>'; }).join('') + '</select></div><div class="hint">关联只保存文献题录关系，不复制全文。</div>';
    openModal({
      title: '关联资料',
      body: body,
      submitLabel: '关联',
      onSubmit: function (fd) {
        var id = str(fd.get('itemId'));
        if (id && c.itemIds.indexOf(id) < 0) c.itemIds.push(id);
        c.updatedAt = Date.now();
        markDirty({ immediate: true });
        closeModal();
        render();
        toast('已关联资料');
      }
    });
  }
  function unlinkCaseItem(itemId) {
    var c = findCase(APP.route.caseId);
    if (!c) return;
    c.itemIds = c.itemIds.filter(function (x) { return x !== itemId; });
    c.updatedAt = Date.now();
    markDirty({ immediate: true });
    render();
  }
  function caseToSearch() {
    var c = collectCaseForm();
    if (!c) return;
    var kw = str(c.keywords);
    if (!kw) { toast('请先填写研究关键词'); return; }
    APP.section = 'search';
    APP.route = { section: 'search' };
    APP.ui.search.tab = 'lit';
    APP.ui.search.q = kw;
    navigateHash();
    render();
    setTimeout(function () { runSearch(); }, 50);
    toast('仅使用研究关键词检索，未发送病例内容');
  }
  function buildCasePack(c) {
    var items = c.itemIds.map(findItem).filter(Boolean);
    var notes = notesFor({ caseId: c.id });
    var tasks = caseTasks(c);
    return '# 医学病例讨论交接单（医学研究工作台）\n\n' +
      '- 匿名编号：' + c.code + '\n- 标题：' + c.title + '\n- 整理时间：' + fmtDateTime(Date.now()) + '\n\n' +
      '## 用户提供的信息（未经 AI 改写）\n\n### 主诉\n' + (c.chief || '未提供') + '\n\n### 现病史\n' + (c.present || '未提供') + '\n\n### 既往史 / 用药 / 过敏史\n' + (c.past || '未提供') + '\n\n### 检查资料\n' + (c.exams || '未提供') + '\n\n### 待讨论的医学问题\n' + (c.questions || '未提供') + '\n\n' +
      '## 相关资料（仅题录）\n' + (items.length ? items.map(function (it) { return '- ' + it.title + (it.doi ? ' · DOI ' + it.doi : '') + (it.pmid ? ' · PMID ' + it.pmid : ''); }).join('\n') : '（无）') + '\n\n' +
      '## 我的笔记\n' + (notes.length ? notes.map(function (n) { return '- ' + n.body; }).join('\n') : '（无）') + '\n\n' +
      '## 待办任务\n' + (tasks.length ? tasks.map(function (t) { return '- [' + TASK_STATUS[t.status] + '] ' + t.title + (t.due ? '（截止 ' + t.due + '）' : ''); }).join('\n') : '（无）') + '\n\n' +
      '## 请协助\n请先确认哪些信息缺失，再围绕上述问题给出循证讨论要点。不得补写未提供的症状、体征、检查或用药；涉及具体患者决策时，请提示由执业医师结合现场评估。\n';
  }
  function sendCaseToNative() {
    var c = collectCaseForm();
    if (!c) return;
    var pack = buildCasePack(c);
    var embedded = !!findNativeComposer();
    var body = '<div class="banner"><div class="grow">' + (embedded
      ? '检测到同一 DSH 窗口的原生输入框。点击下方按钮会把病例整理稿放入输入框，<b>不会自动发送</b>；请先检查隐私与措辞再决定是否发送。'
      : '当前不在 DSH 原生窗口内（或未找到输入框）。点击按钮会复制整理稿；请粘贴到原生会话并自行确认是否发送。') + '</div></div>' +
      '<div class="field"><label>整理稿预览（含病例信息，请确认可对外发送）</label><textarea class="textarea" rows="14" readonly>' + esc(pack) + '</textarea></div>';
    openModal({
      title: '交给原生会话',
      body: body,
      submitLabel: embedded ? '放入原生草稿（不发送）' : '复制整理稿',
      onSubmit: async function () {
        var res = await putNativeDraft(pack);
        if (res.ok) {
          toast('病例整理稿已放入原生输入框，请检查后自行发送（未自动发送）。');
          return true;
        }
        var ok = res.copied;
        if (!ok) ok = await copyText(pack);
        if (!embedded) {
          try { window.open('/', '_blank', 'noopener'); } catch (e) {}
        }
        toast(ok ? '未找到可写入的原生输入框，已复制病例整理稿；请粘贴到原生会话。' : '复制失败，请手动复制上方内容');
        return true;
      }
    });
  }
  async function organizeCaseWithAi() {
    var c = collectCaseForm();
    if (!c) return;
    var text = buildCasePack(c);
    toast('正在生成 AI 整理稿…');
    try {
      var result = await askHostModel({
        question: '请整理这份病例：列出信息缺口、需要澄清的矛盾点，并围绕待讨论问题给出循证讨论框架。',
        itemTitle: '病例整理：' + c.title,
        kind: 'case',
        chunks: [{ label: 'C1', page: '', text: text }]
      });
      c.aiSummary = result.answer;
      c.aiAt = Date.now();
      c.aiTruncated = !!result.truncated;
      c.aiFinishReason = result.finishReason || '';
      c.updatedAt = Date.now();
      markDirty({ immediate: true });
      render();
      toast(result.truncated ? 'AI 整理稿已生成，但输出被截断（' + (result.finishReason || 'max-tokens') + '），请核对' : 'AI 整理稿已生成，请核对后再使用');
    } catch (err) {
      toast('AI 整理失败：' + apiErrorMessage(err));
    }
  }
  function caseTaskCreate(c) {
    openTaskModal({ subjectType: 'case', subjectId: c.id, subjectLabel: c.title, title: '病例讨论：' + c.title });
  }

</script>
<script>
/* ===== events.js ===== */
  /* ================================================================
     补充交互（资料库筛选、文件选择、Zotero、设置内按钮）
     这些动作在 core 的事件表之外单独分发，避免主表过长。
     ================================================================ */
  function openTopics() {
    APP.section = 'library';
    APP.route = { section: 'library' };
    APP.ui.library.tab = 'topics';
    navigateHash();
    renderNav();
    render();
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (['libTab', 'libStar', 'libReset', 'taskResetFilter', 'openTopics', 'loadBackups', 'pickPdf', 'zoteroSearch', 'zoteroImport'].indexOf(act) < 0) return;
    if (act === 'libTab') {
      APP.ui.library.tab = el.getAttribute('data-tab') || 'materials';
      render();
    } else if (act === 'libStar') {
      APP.ui.library.star = !APP.ui.library.star;
      render();
    } else if (act === 'libReset') {
      APP.ui.library.q = '';
      APP.ui.library.type = '';
      APP.ui.library.status = '';
      APP.ui.library.topic = '';
      APP.ui.library.tag = '';
      APP.ui.library.sort = 'recent';
      APP.ui.library.star = false;
      render();
    } else if (act === 'taskResetFilter') {
      APP.ui.tasks = { q: '', priority: '', status: '' };
      render();
    } else if (act === 'openTopics') {
      openTopics();
    } else if (act === 'loadBackups') {
      loadBackupList();
    } else if (act === 'pickPdf') {
      $('#filePdf').click();
    } else if (act === 'zoteroSearch') {
      zoteroSearch();
    } else if (act === 'zoteroImport') {
      importZoteroItem(el.getAttribute('data-key'));
    }
  });

  function ensureFocusAfterRender(focusId, selStart) {
    setTimeout(function () {
      var el = document.getElementById(focusId);
      if (!el) return;
      el.focus();
      try { el.setSelectionRange(selStart, selStart); } catch (e) {}
    }, 0);
  }

  document.addEventListener('input', function (ev) {
    var el = ev.target;
    if (el.matches('[data-filter]')) {
      var key = el.getAttribute('data-filter');
      APP.ui.library[key] = el.value;
      renderLibraryRows();
    } else if (el.matches('[data-taskfilter]')) {
      var k2 = el.getAttribute('data-taskfilter');
      APP.ui.tasks[k2] = el.value;
      var pos = el.selectionStart;
      render();
      ensureFocusAfterRender('taskQ', pos);
    }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target;
    if (el.matches('[data-filter]')) {
      APP.ui.library[el.getAttribute('data-filter')] = el.value;
      renderLibraryRows();
    } else if (el.matches('[data-taskfilter]')) {
      APP.ui.tasks[el.getAttribute('data-taskfilter')] = el.value;
      render();
    }
  });

  $('#fileImport').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (file) importBackupFile(file);
  });
  $('#filePdf').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (file) uploadPdfFile(file);
  });

  async function uploadPdfFile(file) {
    if (!APP.bridge.online) {
      toast('上传需要本地服务；也可以直接填写本机绝对路径');
      return;
    }
    if (file.size > 60 * 1024 * 1024) {
      toast('文件超过 60 MB，请改为填写本机路径');
      return;
    }
    toast('正在上传 PDF 到项目 data/uploads…');
    try {
      var buf = await file.arrayBuffer();
      var bytes = new Uint8Array(buf);
      var binary = '';
      var chunk = 0x8000;
      for (var i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      var r = await fetchJsonNice(APP.bridge.url + '/files/upload', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ name: file.name, mime: file.type || 'application/pdf', base64: btoa(binary) })
      }, 90000);
      if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
      var p = r.json.path;
      var res = upsertItem({
        title: file.name.replace(/\.pdf$/i, ''),
        type: '期刊文献',
        filePath: p,
        source: { type: 'local', label: '本地上传', at: Date.now() }
      });
      markDirty({ immediate: true });
      closeModal();
      render();
      toast(res && res.merged ? '已合并到现有资料' : 'PDF 已加入资料库');
    } catch (err) {
      toast('上传失败：' + apiErrorMessage(err));
    }
  }

</script>
<script>
/* ===== boot.js ===== */
  /* ================================================================
     启动
     ================================================================ */
  async function boot() {
    try {
      applyHash();
      if (!APP.route.section) APP.route.section = 'home';
      APP.section = APP.route.section || 'home';
      await bootData();
      applyFontSize();
      renderHead();
      renderNav();
      render();
      updateSaveBanner();
      modelRefresh({ paint: false });
      if (!APP.bridge.online) {
        setTimeout(function () {
          toast('本地服务未连接：检索可用页面直连；Zotero 与文件保存需启动本地服务。模型由顶栏「模型」设置单独配置。');
        }, 900);
      }
    } catch (err) {
      console.error('[medwb] boot failed', err);
      var view = $('#view');
      if (view) {
        view.innerHTML = '<div class="page"><div class="banner bannerBad"><div class="grow"><b>工作台启动失败</b><br>' + esc(err && err.message ? err.message : String(err)) + '<br><span class="muted">可刷新窗口重试；数据仍保存在浏览器与项目文件中。</span></div><button class="btn btnMini" data-act="reload">刷新窗口</button></div></div>';
      }
    }
  }
  window.addEventListener('focus', function () {
    if (APP.bridge.checkedAt && Date.now() - APP.bridge.checkedAt > 60000) probeBridge();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && APP.bridge.checkedAt && Date.now() - APP.bridge.checkedAt > 60000) probeBridge();
  });
  window.addEventListener('offline', function () { toast('网络已断开：依赖上游的检索会失败，本地阅读与已保存资料不受影响。'); });
  window.addEventListener('online', function () { toast('网络已恢复。'); });
  setInterval(function () {
    if (document.visibilityState === 'visible' && !APP.modal.busy) {
      probeBridge().then(function () {
        if (!$('#modalMask').hidden && !APP.modelSettingsOpen && APP.settingsTab === 'conn') switchSettingsTab('conn');
      });
      // 只读取设置，不调用付费模型；模型设置打开时完全不刷新，避免清空输入。
      if (!APP.modelSettingsOpen) modelRefresh({ paint: false });
    }
  }, 60000);

  boot();

</script>
