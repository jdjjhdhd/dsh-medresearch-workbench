<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>医学研究工作台</title>
<link rel="stylesheet" href="/api/worktable/template/dshell.css" />
<style>
  :root{
    --line: var(--dsw-alias-border-l1, #262b36);
    --line2: var(--dsw-alias-border-l2, #3a4150);
    --fill: var(--dsw-alias-fill-l1, rgba(255,255,255,.022));
    --fill2: rgba(255,255,255,.045);
    --bg: var(--dsw-alias-bg-base, #0b0e14);
    --bgOverlay: var(--dsw-alias-bg-overlay, #11151d);
    --txt: var(--dsw-alias-label-primary, #e6e8eb);
    --txt2: var(--dsw-alias-label-secondary, #9aa4b2);
    --txt3: var(--dsw-alias-label-tertiary, #6b7280);
    --accent: var(--dsw-alias-state-accent-primary, #4f8ef7);
    --green:#3fb950; --amber:#d29922; --red:#f85149; --teal:#2dd4bf; --violet:#a78bfa;
    --readerFont: 14px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:2px}
  ::selection{background:rgba(79,142,247,.35)}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
  ::-webkit-scrollbar-track{background:transparent}
  .app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
  /* ---------- 顶部 ---------- */
  .appHead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(45,212,191,.045),transparent)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brandMark{width:33px;height:33px;flex:none;border-radius:9px;display:grid;place-items:center;border:1px solid rgba(45,212,191,.34);background:linear-gradient(135deg,rgba(45,212,191,.24),rgba(79,142,247,.16));color:#d9fffa;box-shadow:inset 0 0 18px rgba(45,212,191,.12)}
  .brandMark svg{width:18px;height:18px}
  .brandText{min-width:0}
  .brandText h1{margin:0;font-size:15.5px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
  .headSub{margin:1px 0 0;font-size:11px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .headRight{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
  .statusChip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--line);border-radius:999px;background:var(--fill);color:var(--txt2);font-size:10.5px;white-space:nowrap;cursor:default}
  .statusChip .dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);flex:none}
  .statusChip.ok .dot{background:var(--green);box-shadow:0 0 5px var(--green)}
  .statusChip.warn .dot{background:var(--amber);box-shadow:0 0 5px var(--amber)}
  .statusChip.bad .dot{background:var(--red);box-shadow:0 0 5px var(--red)}
  .statusChip.click{cursor:pointer}
  .statusChip.click:hover{border-color:var(--line2);color:var(--txt)}
  .iconBtn{width:27px;height:27px;display:grid;place-items:center;border:1px solid transparent;border-radius:7px;background:none;color:var(--txt2);font-size:12px;cursor:pointer;flex:none}
  .iconBtn:hover{background:var(--fill2);border-color:var(--line);color:var(--txt)}
  /* ---------- 侧栏 ---------- */
  .appBody{flex:1;display:flex;min-height:0}
  .navRail{width:196px;flex:none;display:flex;flex-direction:column;gap:2px;padding:8px 8px 10px;border-right:1px solid var(--line);background:rgba(255,255,255,.012);overflow:auto}
  .navLabel{padding:8px 10px 5px;font-size:9.5px;letter-spacing:.14em;color:var(--txt3)}
  .navItem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:none;color:var(--txt2);font-size:12.5px;text-align:left;cursor:pointer}
  .navItem svg{width:15px;height:15px;flex:none;opacity:.82}
  .navItem:hover{background:var(--fill2);color:var(--txt)}
  .navItemOn{background:rgba(79,142,247,.11);border-color:rgba(79,142,247,.3);color:var(--txt)}
  .navItemOn svg{opacity:1}
  .navCount{margin-left:auto;min-width:18px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--txt3);font-size:10px;text-align:center;line-height:1.7}
  .railFoot{margin-top:auto;padding:10px 9px 2px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.7;color:var(--txt3)}
  .railFoot b{color:var(--txt2);font-weight:500}
  .mainCol{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
  .topTabs{display:none;flex:none;gap:2px;padding:5px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .topTabs::-webkit-scrollbar{display:none}
  .topTab{flex:none;padding:7px 10px;border:none;border-bottom:2px solid transparent;background:none;color:var(--txt2);font-size:12px;cursor:pointer;white-space:nowrap}
  .topTabOn{color:var(--txt);border-bottom-color:var(--accent)}
  .mainScroll{flex:1;overflow:auto;padding:14px 16px 26px}
  .page{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  /* ---------- 通用 ---------- */
  .pageHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .pageTitle{margin:0;font-size:18px;font-weight:650;letter-spacing:.01em}
  .pageSub{margin:3px 0 0;font-size:11.5px;color:var(--txt2);line-height:1.6}
  .pageActions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:5px 12px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--txt2);font-size:12px;cursor:pointer;white-space:nowrap}
  .btn:hover{color:var(--txt);border-color:var(--line2);background:var(--fill2)}
  .btnPrimary{background:#2f9e6b;border-color:#2f9e6b;color:#fff;font-weight:600}
  .btnPrimary:hover{background:#37b77c;border-color:#37b77c;color:#fff}
  .btnAccent{background:rgba(79,142,247,.15);border-color:rgba(79,142,247,.4);color:#bcd5ff}
  .btnAccent:hover{background:rgba(79,142,247,.22);color:#dce9ff}
  .btnDanger{color:var(--red);border-color:rgba(248,81,73,.38)}
  .btnDanger:hover{color:var(--red);border-color:rgba(248,81,73,.65);background:rgba(248,81,73,.06)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btnMini{padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--txt2);font-size:11px;cursor:pointer;white-space:nowrap;line-height:1.7}
  .btnMini:hover{color:var(--txt);border-color:var(--line2);background:var(--fill2)}
  .btnMiniOn{color:var(--accent);border-color:rgba(79,142,247,.4);background:rgba(79,142,247,.08)}
  .btnMiniDanger{color:var(--red);border-color:rgba(248,81,73,.3)}
  .btnMiniDanger:hover{color:var(--red);border-color:rgba(248,81,73,.6)}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--fill);padding:12px 14px;min-width:0}
  .cardPad0{padding:0;overflow:hidden}
  .cardHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;flex-wrap:wrap}
  .cardHead h3{margin:0;font-size:12.5px;font-weight:600;color:var(--txt)}
  .cardHead .muted{font-size:10.5px}
  .muted{color:var(--txt3);font-size:10.5px}
  .sub{color:var(--txt2);font-size:11.5px;line-height:1.65}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .gridAuto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .statCard{border:1px solid var(--line);border-radius:10px;background:var(--fill);padding:11px 13px;cursor:pointer;transition:.12s}
  .statCard:hover{border-color:var(--line2);background:var(--fill2)}
  .statLabel{font-size:10.5px;color:var(--txt3)}
  .statValue{font-size:24px;font-weight:650;line-height:1.35;letter-spacing:.01em}
  .statHint{font-size:10.5px;color:var(--txt2)}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:var(--fill);color:var(--txt2);font-size:10.5px;line-height:1.7;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .chipAccent{color:#9fc3ff;border-color:rgba(79,142,247,.36);background:rgba(79,142,247,.08)}
  .chipTeal{color:#8ff0e4;border-color:rgba(45,212,191,.34);background:rgba(45,212,191,.08)}
  .chipWarn{color:#e8c46a;border-color:rgba(210,153,34,.36);background:rgba(210,153,34,.08)}
  .modelInfoBox{border:1px solid var(--line);border-radius:10px;background:var(--fill);padding:10px}
  .modelStatusBox{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--fill);font-size:11.5px;line-height:1.5}
  .modelStatusBox.ok{border-color:rgba(63,185,80,.38);background:rgba(63,185,80,.06)}
  .modelStatusBox.warn{border-color:rgba(210,153,34,.34);background:rgba(210,153,34,.06)}
  .modelStatusBox.bad{border-color:rgba(248,81,73,.36);background:rgba(248,81,73,.06)}
  .chipDanger{color:#ff9a94;border-color:rgba(248,81,73,.34);background:rgba(248,81,73,.08)}
  .chipGhost{background:transparent}
  .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-width:0}
  .banner{display:flex;align-items:flex-start;gap:9px;padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--fill);font-size:11.5px;color:var(--txt2);line-height:1.6}
  .banner b{color:var(--txt)}
  .bannerWarn{border-color:rgba(210,153,34,.32);background:rgba(210,153,34,.06)}
  .bannerBad{border-color:rgba(248,81,73,.3);background:rgba(248,81,73,.06)}
  .bannerOk{border-color:rgba(63,185,80,.3);background:rgba(63,185,80,.05)}
  .banner .grow{flex:1;min-width:0}
  .divider{height:1px;background:var(--line);margin:9px 0}
  .kv{display:grid;grid-template-columns:92px 1fr;gap:5px 10px;font-size:11.5px}
  .kv .k{color:var(--txt3)}
  .kv .v{color:var(--txt2);min-width:0;overflow-wrap:anywhere}
  .empty{padding:26px 14px;border:1px dashed var(--line);border-radius:10px;color:var(--txt3);font-size:12px;text-align:center;line-height:1.8}
  .empty .btnMini{margin-top:6px}
  .loadingRow{display:flex;align-items:center;gap:8px;padding:14px;color:var(--txt2);font-size:11.5px}
  .spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.18);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--fill)}
  .listRow{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer;min-width:0}
  .listRow:last-child{border-bottom:none}
  .listRow:hover{background:var(--fill2)}
  .listRowMain{flex:1;min-width:0}
  .rowTitle{font-size:12.5px;font-weight:550;line-height:1.5;color:var(--txt);overflow-wrap:anywhere}
  .rowTitle:hover{color:var(--accent)}
  .rowMeta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:10.5px;color:var(--txt3)}
  .rowOps{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:46%}
  .sortBar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:7px;background:rgba(0,0,0,.16);padding:6px 9px;font-size:12px;color:var(--txt);outline:none;min-width:0}
  .input:focus,.textarea:focus,.select:focus{border-color:rgba(79,142,247,.55);box-shadow:0 0 0 2px rgba(79,142,247,.12)}
  .textarea{resize:vertical;line-height:1.65}
  .select{cursor:pointer}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0}
  .field > label{font-size:10.5px;color:var(--txt2)}
  .field .hint{font-size:10px;color:var(--txt3);line-height:1.5}
  .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .formGrid .span2{grid-column:1/-1}
  .toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .toolbar .grow{flex:1;min-width:150px}
  .toolbar .input,.toolbar .select{height:30px}
  .toolbar .select{width:auto;min-width:98px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:7px 11px;border:none;border-bottom:2px solid transparent;background:none;color:var(--txt2);font-size:12px;cursor:pointer;white-space:nowrap}
  .tab:hover{color:var(--txt)}
  .tabOn{color:var(--txt);border-bottom-color:var(--accent)}
  .subtabs{display:flex;gap:4px;flex-wrap:wrap}
  .subtab{padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--txt2);font-size:11px;cursor:pointer}
  .subtabOn{color:var(--txt);border-color:rgba(79,142,247,.42);background:rgba(79,142,247,.1)}
  .tableWrap{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--fill)}
  table.tbl{width:100%;border-collapse:collapse;font-size:11.5px;min-width:640px}
  .tbl th{position:sticky;top:0;z-index:1;text-align:left;padding:8px 10px;background:#12161e;border-bottom:1px solid var(--line);color:var(--txt3);font-weight:500;font-size:10.5px;white-space:nowrap}
  .tbl td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:top;color:var(--txt2)}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr:hover{background:rgba(255,255,255,.025)}
  .tbl .titleCell{font-size:12px;color:var(--txt);font-weight:550;line-height:1.45}
  .tbl .titleCell:hover{color:var(--accent)}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10.5px}
  .pathCode{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;color:var(--txt2);background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
  .progress{height:5px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .progressBar{height:100%;background:linear-gradient(90deg,var(--teal),var(--accent));border-radius:999px}
  .splitActions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .grow{flex:1;min-width:0}
  .nowrap{white-space:nowrap}
  .right{text-align:right}
  .mt8{margin-top:8px}.mt12{margin-top:12px}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .flexTop{display:flex;gap:10px;align-items:flex-start}
  .clickable{cursor:pointer}
  .clickable:hover{color:var(--accent)}
  /* ---------- 抽屉 / 弹窗 ---------- */
  .overlay{position:fixed;inset:0;z-index:40;background:rgba(3,5,9,.55);backdrop-filter:blur(1.5px)}
  .drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(480px,92vw);display:flex;flex-direction:column;background:var(--bgOverlay);border-left:1px solid var(--line2);box-shadow:-18px 0 50px rgba(0,0,0,.45);animation:slideIn .16s ease}
  @keyframes slideIn{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
  .drawerHead{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:13px 15px 11px;border-bottom:1px solid var(--line)}
  .drawerHead h2{margin:0;font-size:14px;font-weight:650;line-height:1.5;overflow-wrap:anywhere}
  .drawerBody{flex:1;overflow:auto;padding:13px 15px 18px;display:flex;flex-direction:column;gap:12px}
  .drawerFoot{flex:none;display:flex;gap:6px;flex-wrap:wrap;padding:10px 15px;border-top:1px solid var(--line);background:rgba(0,0,0,.14)}
  .modalMask{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(4,6,10,.64);backdrop-filter:blur(2px)}
  .modal{width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:13px;background:var(--bgOverlay);box-shadow:0 20px 60px rgba(0,0,0,.55);overflow:hidden}
  .modalHead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
  .modalHead h2{margin:0;font-size:14px;font-weight:650}
  .modalBody{flex:1;overflow:auto;padding:13px 15px;display:flex;flex-direction:column;gap:11px}
  .modalFoot{flex:none;display:flex;align-items:center;gap:7px;padding:10px 15px;border-top:1px solid var(--line)}
  .modalFoot .spacer{flex:1}
  .toast{position:fixed;left:50%;bottom:20px;z-index:70;transform:translate(-50%,10px);padding:7px 15px;border:1px solid var(--line2);border-radius:999px;background:#1a2330;color:var(--txt);font-size:12px;opacity:0;pointer-events:none;transition:.18s;box-shadow:0 10px 34px rgba(0,0,0,.5);max-width:82vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  /* ---------- 首页 ---------- */
  .homeHero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,rgba(45,212,191,.07),rgba(79,142,247,.05) 55%,transparent)}
  .homeHero h2{margin:0;font-size:17px;font-weight:650}
  .homeHero p{margin:4px 0 0;font-size:11.5px;color:var(--txt2);line-height:1.7;max-width:720px}
  .flowLine{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;color:var(--txt3);margin-top:8px}
  .flowLine .step{padding:2px 8px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03)}
  .flowLine .arrow{color:var(--txt3)}
  .topicCard{border:1px solid var(--line);border-radius:10px;background:var(--fill);padding:10px 12px;cursor:pointer;min-width:0}
  .topicCard:hover{border-color:var(--line2);background:var(--fill2)}
  .topicCard h4{margin:0;font-size:12.5px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
  /* ---------- 资料库 ---------- */
  .libLayout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .star{background:none;border:none;color:var(--amber);font-size:13px;cursor:pointer;padding:0 1px;line-height:1.2}
  .starOff{color:var(--txt3)}
  .star:hover{color:var(--amber)}
  .cellTitle{font-size:12px;color:var(--txt);font-weight:550;line-height:1.45;cursor:pointer}
  .cellTitle:hover{color:var(--accent)}
  .cellSub{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:10.5px;color:var(--txt3)}
  .statusPill{display:inline-flex;align-items:center;gap:5px;padding:0 8px;border:1px solid var(--line);border-radius:999px;font-size:10px;line-height:1.8;color:var(--txt2);background:var(--fill)}
  .statusPill.read{color:#9be8b8;border-color:rgba(63,185,80,.32);background:rgba(63,185,80,.07)}
  .statusPill.reading{color:#e8c46a;border-color:rgba(210,153,34,.32);background:rgba(210,153,34,.07)}
  .statusPill.unread{color:var(--txt3)}
  /* ---------- 阅读台 ---------- */
  .readerShell{display:grid;grid-template-columns:214px minmax(0,1fr) 336px;gap:10px;height:calc(100vh - 136px);min-height:460px}
  .docList{border:1px solid var(--line);border-radius:10px;background:var(--fill);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .docListHead{flex:none;padding:9px 10px 8px;border-bottom:1px solid var(--line)}
  .docListScroll{flex:1;overflow:auto;padding:6px}
  .docItem{display:flex;flex-direction:column;gap:2px;padding:7px 8px;border:1px solid transparent;border-radius:7px;cursor:pointer;min-width:0}
  .docItem:hover{background:var(--fill2)}
  .docItemOn{border-color:rgba(79,142,247,.38);background:rgba(79,142,247,.1)}
  .docItem .t{font-size:11.5px;line-height:1.45;color:var(--txt);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .docItem .m{font-size:10px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    }
    try {
      var doc = t.doc;

  /* ================================================================
     持久化：本地桥接 → 工作台项目文件 → 浏览器
     ================================================================ */
  function readLocalState() {
    try {
      var raw = localStorage.getItem(projectStorageKey(LS_KEY));
      if (!raw) {
        APP.legacyCacheUnassigned = Boolean(localStorage.getItem(LS_KEY));
        return null;
      }
      var parsed = safeJsonParse(raw);
      return parsed ? normalizeState(parsed) : null;
    } catch (e) { return null; }
  }
  function writeLocalState() {
    try { localStorage.setItem(projectStorageKey(LS_KEY), JSON.stringify(APP.data)); } catch (e) {}
  }
  function setSaveMode(mode, error) {
    APP.save.mode = mode;
    APP.save.at = Date.now();
    APP.save.error = error || '';
    APP.save.saving = false;
    renderHead();
    updateSaveBanner();
  }
  var saveChain = Promise.resolve();
  function saveNow(reason) {
    if (!APP.data) return Promise.resolve(false);
    APP.data.updatedAt = Date.now();
    writeLocalState();
    APP.save.saving = true;
    APP.save.error = '';
    renderHead();
    var stamp = APP.data.updatedAt;
    var payload = JSON.stringify(APP.data, null, 2);
    var run = function () { return doSave(payload, stamp); };
    saveChain = saveChain.then(run, run);
    return saveChain;
  }
  function doSave(payload, stamp) {
    var data = JSON.parse(payload);
    var bridgeTry = APP.bridge.online
      ? fetchJsonNice(APP.bridge.url + '/data/save', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ data: data })
        }, 12000).then(function (r) {
          if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
          return true;
        })
      : Promise.reject(new Error('桥接未连接'));
    return bridgeTry
      .then(function () {
        setSaveMode('bridge');
        if (APP.data.updatedAt <= stamp) APP.save.dirty = false;
        else saveSoon();
        return true;
      })
      .catch(function (bridgeErr) {
        var file = dataFilePath();
        if (!file) throw bridgeErr;
        return ensureDataDir().then(function () {
          return fetchJsonNice('/api/worktable/write', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ path: file, content: payload })
          }, 15000);
        }).then(function (r) {
          if (!r.ok) throw new Error((r.json && r.json.error) || ('写入失败 HTTP ' + r.status));
          setSaveMode('worktable');
          if (APP.data.updatedAt <= stamp) APP.save.dirty = false;
          else saveSoon();
          return true;
        });
      })
      .catch(function (err) {
        setSaveMode('local', apiErrorMessage(err));
        APP.save.dirty = true;
        updateSaveBanner();
        return false;
      });
  }
  var saveSoon = debounce(function () { saveNow('debounce'); }, 700);
  function markDirty(opts) {
    opts = opts || {};
    APP.data.updatedAt = Date.now();
    writeLocalState();
    APP.save.dirty = true;
    APP.save.saving = true;
    renderHead();
    updateSaveBanner();
    if (opts.immediate) saveNow('immediate');
    else saveSoon();
  }
  var dataDirEnsured = false;
  function ensureDataDir() {
    if (dataDirEnsured) return Promise.resolve(true);
    var dir = projectDir();
    if (!dir) return Promise.resolve(false);
    return fetchJsonNice('/api/worktable/mkdir', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ path: joinPath(dir, 'data') })
    }, 8000).then(function () {
      dataDirEnsured = true;
      return true;
    }).catch(function () { return false; });
  }
  function probeBridge() {
    APP.bridge.probing = true;
    return fetchJsonNice(APP.bridge.url + '/health', {}, 2600)
      .then(function (r) {
        if (!r.ok || !bridgeIdentityMatches(r.json)) throw new Error('本地服务身份或项目目录不匹配，已停止使用该服务');
        APP.bridge.online = true;
        APP.bridge.verifiedUrl = APP.bridge.url;
        APP.bridge.health = r.json;
        APP.bridge.error = '';
        APP.bridge.checkedAt = Date.now();
        return true;
      })
      .catch(function (err) {
        APP.bridge.online = false;
        APP.bridge.verifiedUrl = '';
        APP.bridge.health = null;
        APP.bridge.error = err.name === 'AbortError' ? '连接超时' : apiErrorMessage(err);
        APP.bridge.checkedAt = Date.now();
        return false;
      })
      .finally(function () {
        APP.bridge.probing = false;
        renderHead();
      });
  }
  function ensureLocalService() {
    return fetchJsonNice('/api/medresearch/model/service/ensure', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: '{}'
    }, 60000).then(function (r) {
      var bridge = r && r.json && r.json.bridge;
      if (!r.ok || !bridge || !bridge.online || !bridgeIdentityMatches(bridge.health)) {
        throw new Error((bridge && bridge.error) || (r.json && r.json.error && r.json.error.message) || '本地文件服务未启动');
      }
      if (bridge.url) APP.bridge.url = bridge.url;
      localStorage.setItem(projectStorageKey(LS_BRIDGE_KEY), APP.bridge.url);
      APP.bridge.health = bridge.health;
      APP.bridge.online = true;
      APP.bridge.verifiedUrl = APP.bridge.url;
      APP.bridge.error = '';
      APP.bridge.note = bridge.note || '';
      return bridge;
    }).catch(function (err) {
      APP.bridge.online = false;
      APP.bridge.verifiedUrl = '';
      APP.bridge.error = '本地文件服务未启动：' + apiErrorMessage(err);
      return null;
    });
  }
  async function bootData() {
    var local = readLocalState();
    var candidates = [];
    if (local) candidates.push({ data: local, source: 'local', at: local.updatedAt || 0 });
    var worktable = null;
    var file = dataFilePath();
    if (file) {
      try {
        var r = await fetchJsonNice('/api/worktable/file?path=' + encodeURIComponent(file), {}, 5000);
        if (r.ok && r.json && r.json.version === 1) {
          worktable = normalizeState(r.json);
          candidates.push({ data: worktable, source: 'worktable', at: worktable.updatedAt || 0 });
        }
      } catch (e) {}
    }
    await probeBridge();
    if (!APP.bridge.online && !APP.bridge.autoStartTried) {
      APP.bridge.autoStartTried = true;
      await ensureLocalService();
      await probeBridge();
    }
    var bridgeData = null;
    if (APP.bridge.online) {
      try {
        var br = await fetchJsonNice(APP.bridge.url + '/data/load', {}, 6000);
        if (br.ok && br.json && br.json.version === 1) {
          bridgeData = normalizeState(br.json);
          candidates.push({ data: bridgeData, source: 'bridge', at: bridgeData.updatedAt || 0 });
        }
      } catch (e) {}
    }
    var chosen = null;
    candidates.forEach(function (c) { if (!chosen || c.at > chosen.at) chosen = c; });
    if (chosen) {
      APP.data = chosen.data;
      APP.source = chosen.source;
      APP.data.seeded = true;
      APP.save.mode = chosen.source === 'bridge' ? 'bridge' : chosen.source === 'worktable' ? 'worktable' : 'local';
      APP.save.at = chosen.at || Date.now();
      APP.save.dirty = false;
    } else {
      APP.data = emptyState();
      APP.source = 'new';
      markDirty({ immediate: true });
    }
    APP.data.settings.fontSize = clamp(num(APP.data.settings.fontSize, 14), 12, 22);
    applyFontSize();
    // 浏览器数据比文件新时，启动后补写文件，避免两处不一致。
    if (chosen && chosen.source === 'local' && (APP.bridge.online || file)) {
      saveNow('boot-sync');
    }
    if (chosen && chosen.source === 'worktable' && APP.bridge.online && bridgeData && bridgeData.updatedAt < chosen.at) {
      saveNow('boot-sync-bridge');
    }
  }

    navigateHash();
    renderNav();
    render();
    var view = $('#view');
    if (view) view.scrollTop = 0;
  }
  function applyFontSize() {
    var size = clamp(num(APP.data && APP.data.settings && APP.data.settings.fontSize, 14), 12, 22);
    document.documentElement.style.setProperty('--readerFont', size + 'px');
  }
  function changeFont(delta) {
    APP.data.settings.fontSize = clamp(num(APP.data.settings.fontSize, 14) + delta, 12, 22);
    applyFontSize();
    writeLocalState();
    markDirty();
    toast('正文字号 ' + APP.data.settings.fontSize + 'px');
  }

  /* ================================================================
     路由（hash）与渲染入口
     ================================================================ */
  function navigateHash() {
    var h = '#' + APP.section;
    if (APP.section === 'reader' && APP.route.itemId) h = '#reader/' + encodeURIComponent(APP.route.itemId);
    else if (APP.section === 'library' && APP.route.topicId) h = '#library/topic/' + encodeURIComponent(APP.route.topicId);
    else if (APP.section === 'cases' && APP.route.caseId) h = '#cases/' + encodeURIComponent(APP.route.caseId);
    try { history.replaceState(null, '', h); } catch (e) {}
  }
  function applyHash() {
    var raw = String(location.hash || '').replace(/^#/, '');
    if (!raw) return;
    var seg = raw.split('/');
    var section = seg[0];
    if (!SECTIONS.some(function (s) { return s.id === section; })) return;
    APP.section = section;
    APP.route = { section: section };
    if (section === 'reader' && seg[1]) APP.route.itemId = decodeURIComponent(seg[1]);
    if (section === 'library' && seg[1] === 'topic' && seg[2]) { APP.section = 'library'; APP.route.topicId = decodeURIComponent(seg[2]); }
    if (section === 'cases' && seg[1]) APP.route.caseId = decodeURIComponent(seg[1]);
  }
  function render() {
    renderNav();
    var view = $('#view');
    if (!view) return;
    var html = '';
    try {
      if (APP.section === 'home') html = renderHome();
      else if (APP.section === 'library') html = APP.route.topicId ? renderTopicPage() : renderLibrary();
      else if (APP.section === 'reader') html = renderReader();
      else if (APP.section === 'search') html = renderSearch();
      else if (APP.section === 'cases') html = APP.route.caseId ? renderCasePage() : renderCases();
      else if (APP.section === 'tasks') html = renderTasks();
      else html = renderHome();
    } catch (err) {
      html = '<div class="page"><div class="banner bannerBad"><div class="grow"><b>界面渲染出错</b><br>' + esc(err && err.message) + '</div><button class="btn btnMini" data-act="reload">刷新窗口</button></div></div>';
      console.error('[medwb] render failed', err);
    }
    view.innerHTML = html;
    afterRender();
  }
  function afterRender() {
    if (APP.section === 'reader') {
      if (READER.pdf && READER.status === 'ready') requestAnimationFrame(function () { renderPdfPage(READER.page, false); });
      else if (READER.itemId && !READER.pdf && !READER.loading && READER.status === 'idle') tryOpenReaderItem(READER.itemId);
    }
  }

  /* ================================================================
     弹窗 / 抽屉 / 提示
     ================================================================ */
  function openModal(cfg) {
    var mask = $('#modalMask');
    $('#modalTitle').textContent = cfg.title || '编辑';
    $('#modalBody').innerHTML = cfg.body || '';
    $('#modalSubmit').textContent = cfg.submitLabel || '保存';
    $('#modalSubmit').hidden = cfg.hideSubmit === true;
    $('#modalDanger').hidden = !cfg.onDelete;
    $('#modalDanger').textContent = cfg.deleteLabel || '删除';
    APP.modal.onSubmit = cfg.onSubmit || null;
    APP.modal.onDelete = cfg.onDelete || null;
    APP.modal.busy = false;
    mask.hidden = false;
    var first = mask.querySelector('input,textarea,select,button');
    if (first && cfg.focus !== false) setTimeout(function () { try { first.focus(); } catch (e) {} }, 30);
  }
  function closeModal() {
    $('#modalMask').hidden = true;
    APP.modal.onSubmit = null;
    APP.modal.onDelete = null;
    APP.modelSettingsOpen = false;
  }
  function openDrawer(type, id) {
    APP.drawer.type = type;
    APP.drawer.id = id;
    $('#overlay').hidden = false;
    $('#drawer').hidden = false;
    renderDrawer();
  }
  function closeDrawer() {
    APP.drawer.type = '';
    APP.drawer.id = '';
    $('#overlay').hidden = true;
    $('#drawer').hidden = true;
  }
  function renderDrawer() {
    if (!APP.drawer.type) return;
    var body = $('#drawerBody');
    var foot = $('#drawerFoot');
    if (APP.drawer.type === 'item') {
      var item = findItem(APP.drawer.id);
      if (!item) { closeDrawer(); return; }
      $('#drawerTitle').textContent = item.title;
      body.innerHTML = itemDetailHtml(item);
      foot.innerHTML = '<button class="btn btnPrimary" data-act="read" data-id="' + item.id + '">打开阅读台</button><button class="btn" data-act="noteNew" data-item="' + item.id + '">新增笔记</button><button class="btn" data-act="taskNew" data-subject="item" data-subjectid="' + item.id + '">创建任务</button>';
    }
  }

  /* ================================================================
     事件委托
     ================================================================ */
  function onAction(act, el, ev) {
    var id = el.getAttribute('data-id') || '';
    switch (act) {
      case 'nav': setSection(el.getAttribute('data-section')); break;
      case 'settings': openSettings(el.getAttribute('data-tab') || 'conn'); break;
      case 'modelSettings': openModelSettings(); break;
      case 'modelMode': setModelMode(el.getAttribute('data-mode')); break;
      case 'modelSave': modelSave(); break;
      case 'modelTest': modelTest(); break;
      case 'modelClear': modelClear(); break;
      case 'modelClearKey': modelClearKey(); break;
      case 'modelRefresh': modelRefresh({ force: true, paint: true }); break;
      case 'fontInc': changeFont(1); break;
      case 'fontDec': changeFont(-1); break;
      case 'reload': location.reload(); break;
      case 'closeDrawer': closeDrawer(); break;
      case 'closeModal': closeModal(); break;
      case 'setRead': setReadStatus(id, el.getAttribute('data-status')); break;
      case 'star': toggleStar(id); break;
      case 'read': openReader(id); break;
      case 'openItem': openDrawer('item', id); break;
      case 'noteNew': openNoteModal({ itemId: el.getAttribute('data-item') || '', topicId: el.getAttribute('data-topic') || '', caseId: el.getAttribute('data-case') || '', quote: el.getAttribute('data-quote') || '', page: el.getAttribute('data-page') || '' }); break;
      case 'noteEdit': openNoteModal({ id: id }); break;
      case 'noteDelete': deleteNote(id); break;
      case 'taskNew': openTaskModal({ subjectType: el.getAttribute('data-subject') || 'none', subjectId: el.getAttribute('data-subjectid') || '', subjectLabel: el.getAttribute('data-subjectlabel') || '' }); break;
      case 'taskEdit': openTaskModal({ id: id }); break;
      case 'taskDelete': deleteTask(id); break;
      case 'taskCycle': cycleTaskStatus(id); break;
      case 'taskStatus': setTaskStatus(id, el.getAttribute('data-status')); break;
      case 'openTaskLink': openTaskLink(id); break;
      case 'openTopic': openTopic(el.getAttribute('data-topic')); break;
      case 'openCase': openCase(el.getAttribute('data-case')); break;
      case 'topicNew': openTopicModal({}); break;
      case 'topicEdit': openTopicModal({ id: id }); break;
      case 'topicDelete': deleteTopic(id); break;
      case 'itemEdit': openItemModal({ id: id }); break;
      case 'itemDelete': deleteItem(id); break;
      case 'addItem': openAddMenu(el.getAttribute('data-topic') || ''); break;
      case 'addZotero': openZoteroModal(el.getAttribute('data-topic') || ''); break;
      case 'addLocal': openLocalFileModal(el.getAttribute('data-topic') || ''); break;
      case 'addManual': openItemModal({ topicId: el.getAttribute('data-topic') || '' }); break;
      case 'demoClear': clearDemoData(); break;
      case 'demoAdd': addDemoData(); break;
      case 'exportBackup': exportBackup(); break;
      case 'importBackup': $('#fileImport').click(); break;
      case 'retrySave': saveNow('retry'); break;
      case 'testBridge': testBridgeSetting(); break;
      case 'ensureBridge': toast('正在启动本地文件服务…'); ensureLocalService().then(function (bridge) { if (bridge) { probeBridge(); toast('本地文件服务已就绪'); } else { toast(APP.bridge.error || '本地文件服务启动失败'); } }); break;
      case 'saveBridgeUrl': saveBridgeSetting(); break;
      case 'copyStartCmd': copyStartCommand(); break;
      case 'openStartFolder': openStartFolder(); break;
      case 'locateNote': locateNote(id); break;
      case 'locatePage': locatePage(el.getAttribute('data-page')); break;
      case 'readerTab': setReaderTab(el.getAttribute('data-tab')); break;
      case 'readerSelect': selectReaderItem(id); break;
      case 'readerPrev': pageStep(-1); break;
      case 'readerNext': pageStep(1); break;
      case 'zoomIn': zoomStep(0.12); break;
      case 'zoomOut': zoomStep(-0.12); break;
      case 'zoomFit': toggleFit(); break;
      case 'toggleDocList': $('#readerShell').classList.toggle('readerShowList'); break;
      case 'toggleAside': toggleReaderAside(); break;
      case 'reloadPdf': reloadPdf(); break;
      case 'saveSelectionNote': saveSelectionNote(); break;
      case 'saveSelectionHighlight': saveSelectionHighlight(); break;
      case 'explainSelection': explainSelection(); break;
      case 'clearSelection': hideSelectionBar(); break;
      case 'askPaper': askPaperQuestion(); break;
      case 'askSuggestion': setAskInput(el.getAttribute('data-q')); break;
      case 'sendNative': sendReaderToNative(); break;
      case 'pasteFulltext': openPasteFulltextModal(); break;
      case 'openPdfFile': openPdfFile(); break;
      case 'deleteAnnotation': deleteAnnotation(id); break;
      case 'locateAnnotation': locateAnnotation(id); break;
      case 'searchTab': setSearchTab(el.getAttribute('data-tab')); break;
      case 'runSearch': runSearch(); break;
      case 'searchHistory': applySearchHistory(el.getAttribute('data-query')); break;
      case 'addSearchResult': addSearchResult(el.getAttribute('data-kind'), num(el.getAttribute('data-index'), 0)); break;
      case 'searchResultTopic': addSearchResultToTopic(el.getAttribute('data-kind'), num(el.getAttribute('data-index'), 0)); break;
      case 'searchResultTask': searchResultTask(el.getAttribute('data-kind'), num(el.getAttribute('data-index'), 0)); break;
      case 'starSearchResult': starSearchResult(el.getAttribute('data-kind'), num(el.getAttribute('data-index'), 0)); break;
      case 'caseNew': newCase(); break;
      case 'caseOpen': openCase(id); break;
      case 'caseSave': saveCaseForm(); break;
      case 'caseDelete': deleteCase(id); break;
      case 'caseBack': backToCases(); break;
      case 'caseAi': organizeCaseWithAi(); break;
      case 'caseNative': sendCaseToNative(); break;
      case 'caseSearch': caseToSearch(); break;
      case 'caseLinkItem': openCaseItemPicker(); break;
      case 'caseUnlinkItem': unlinkCaseItem(el.getAttribute('data-item')); break;
      case 'caseNoteNew': openNoteModal({ caseId: id }); break;
      case 'taskBoard': setTaskFilter('status', el.getAttribute('data-status')); break;
      case 'taskNewTop': openTaskModal({}); break;
      case 'openExternal': openExternal(el.getAttribute('data-url')); break;
      case 'copyText': copyFromData(el); break;
      case 'closeSelBar': hideSelectionBar(); break;
      case 'settingsTab': switchSettingsTab(el.getAttribute('data-tab')); break;
      case 'refreshConnections': refreshConnections(); break;
      case 'openLicense': openLicenses(); break;
      default: break;
    }
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (!act) return;
    if (act === 'closeModal') return;
    if (el.tagName === 'A') ev.preventDefault();
    onAction(act, el, ev);
  });
  $('#modalClose').addEventListener('click', closeModal);
  $('#modalCancel').addEventListener('click', closeModal);
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#overlay').addEventListener('click', function () { closeDrawer(); hideSelectionBar(); });
  $('#modalForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (APP.modal.busy) return;
    if (!APP.modal.onSubmit) { closeModal(); return; }
    var result = APP.modal.onSubmit(new FormData(ev.target));
    if (result === false) return;
    if (result && typeof result.then === 'function') {
      APP.modal.busy = true;
      $('#modalSubmit').disabled = true;
      result.then(function (keep) {
        if (keep !== true) closeModal();
      }).catch(function (err) {
        toast('操作失败：' + apiErrorMessage(err));
      }).finally(function () {
        APP.modal.busy = false;
        $('#modalSubmit').disabled = false;
      });
    } else {
      closeModal();
    }
  });
  $('#modalDanger').addEventListener('click', function () {
    if (!APP.modal.onDelete) return;
    var r = APP.modal.onDelete();
    if (r && typeof r.then === 'function') r.catch(function (err) { toast('删除失败：' + apiErrorMessage(err)); });
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (!$('#modalMask').hidden) closeModal();
      else if (!$('#drawer').hidden) closeDrawer();
      hideSelectionBar();
    }
  });
  window.addEventListener('hashchange', function () {
    applyHash();
    APP.section = APP.route.section;
    renderNav();
    render();
  });

  /* ================================================================
     通用动作
     ================================================================ */
  function openReader(id) {
    var item = findItem(id);
    if (!item) return;
    if (typeof flushCaseForm === 'function') flushCaseForm();
    if (READER.pdf) { try { READER.pdf.destroy(); } catch (e) {} }
    APP.route.itemId = id;
    APP.section = 'reader';
    READER.itemId = id;
    READER.pdf = null;
    READER.docToken++;
    READER.status = 'idle';
    READER.error = '';
    READER.page = 1;
    READER.textChunks = [];
    READER.pageTextCache = {};
    READER.loading = false;
    item.lastOpenedAt = Date.now();
    if (item.readStatus === 'unread') item.readStatus = 'reading';
    markDirty();
    closeDrawer();
    navigateHash();
    renderNav();
    render();
  }
  function setReadStatus(id, status) {
    var item = findItem(id);
    if (!item || !READ_STATUS[status]) return;
    item.readStatus = status;
    item.updatedAt = Date.now();
    markDirty();
    render();
    if (APP.drawer.id === id) renderDrawer();
  }
  function toggleStar(id) {
    var item = findItem(id);
    if (!item) return;
    item.starred = !item.starred;
    item.updatedAt = Date.now();
    markDirty();
    render();
    if (APP.drawer.id === id) renderDrawer();
  }
  function deleteItem(id) {
    var item = findItem(id);
    if (!item) return;
    if (!window.confirm('删除资料「' + truncate(item.title, 40) + '」？关联笔记会保留，但不再有资料关联。')) return;
    APP.data.items = APP.data.items.filter(function (x) { return x.id !== id; });
    APP.data.notes.forEach(function (n) { if (n.itemId === id) n.itemId = ''; });
    APP.data.tasks.forEach(function (t) { if (t.subjectType === 'item' && t.subjectId === id) { t.subjectType = 'none'; t.subjectId = ''; } });
    APP.data.cases.forEach(function (c) { c.itemIds = c.itemIds.filter(function (x) { return x !== id; }); });
    markDirty({ immediate: true });
    closeDrawer();
    render();
    toast('已删除资料');
  }
  function deleteNote(id) {
    if (!window.confirm('删除这条笔记？')) return;
    APP.data.notes = APP.data.notes.filter(function (n) { return n.id !== id; });
    APP.data.tasks.forEach(function (t) { if (t.subjectType === 'note' && t.subjectId === id) { t.subjectType = 'none'; t.subjectId = ''; } });
    markDirty({ immediate: true });
    render();
    toast('已删除笔记');
  }
  function deleteTask(id) {
    if (!window.confirm('删除这个任务？')) return;
    APP.data.tasks = APP.data.tasks.filter(function (t) { return t.id !== id; });
    APP.data.cases.forEach(function (c) { c.taskIds = c.taskIds.filter(function (x) { return x !== id; }); });
    markDirty({ immediate: true });
    render();
    toast('已删除任务');
  }
  function deleteTopic(id) {
    var t = findTopic(id);
    if (!t) return;
    if (!window.confirm('删除专题「' + t.name + '」？资料本身不会被删除。')) return;
    APP.data.topics = APP.data.topics.filter(function (x) { return x.id !== id; });
    APP.data.items.forEach(function (it) { it.topicIds = it.topicIds.filter(function (x) { return x !== id; }); });
    APP.data.notes.forEach(function (n) { if (n.topicId === id) n.topicId = ''; });
    APP.data.tasks.forEach(function (tk) { if (tk.subjectType === 'topic' && tk.subjectId === id) { tk.subjectType = 'none'; tk.subjectId = ''; } });
    if (APP.route.topicId === id) APP.route.topicId = '';
    markDirty({ immediate: true });
    render();
    toast('已删除专题');
  }
  function openTopic(id) {
    var t = findTopic(id);
    if (!t) return;
    if (typeof flushCaseForm === 'function') flushCaseForm();
    APP.section = 'library';
    APP.route.topicId = id;
    APP.ui.library.tab = 'topics';
    navigateHash();
    renderNav();
    render();
  }
  function openCase(id) {
    if (!findCase(id)) return;
    if (typeof flushCaseForm === 'function' && APP.route.caseId !== id) flushCaseForm();
    APP.section = 'cases';
    APP.route.caseId = id;
    navigateHash();
    renderNav();
    render();
  }
  function backToCases() {
    if (typeof flushCaseForm === 'function') flushCaseForm();
    APP.route.caseId = '';
    APP.section = 'cases';
    navigateHash();
    render();
  }
  function openTaskLink(id) {
    var t = findTask(id);
    if (!t) return;
    if (t.subjectType === 'item' && findItem(t.subjectId)) return openReader(t.subjectId);
    if (t.subjectType === 'topic' && findTopic(t.subjectId)) return openTopic(t.subjectId);
    if (t.subjectType === 'case' && findCase(t.subjectId)) return openCase(t.subjectId);
    if (t.subjectUrl) return openExternal(t.subjectUrl);
    toast('这个任务没有可打开的关联内容');
  }
  function openExternal(url) {
    if (!url) return;
    window.open(url, '_blank', 'noopener');
  }
  async function copyFromData(el) {
    var text = el.getAttribute('data-copy') || '';
    var ok = await copyText(text);
    toast(ok ? '已复制到剪贴板' : '复制失败，请手动选择文本');
  }
  function hideSelectionBar() {
    var bar = $('#selBar');
    if (bar) bar.remove();
    var sel = window.getSelection();
    if (sel) { try { sel.removeAllRanges(); } catch (e) {} }
    APP.selection = null;
    READER.selection = null;
  }




</script>
<script>
/* ===== model.js ===== */
/* ================================================================
   模型接入：DSH 会话模型 / 自定义 OpenAI 兼容 API
   宿主接口为同源相对路径 /api/medresearch/model/*，由原生插件提供。
   ================================================================ */
var MODEL_STATUS_LABELS = {
  untested: '已选择但未测试',
  success: '测试成功',
  unconfigured: '未配置',
  'auth-failed': '认证失败',
  quota: '余额或额度不足',
  'rate-limited': '请求被限流',
  'model-not-found': '模型不存在',
  network: '网络失败',
  timeout: '请求超时',
  'host-unavailable': '宿主接口不可用',
  'bad-config': '配置不完整',
  empty: '模型返回空回答',
  filtered: '内容被安全过滤',
  'upstream-failed': '上游调用失败',
  aborted: '调用已中断'
};
var MODEL_STATUS_CLASS = {
  success: 'ok',
  untested: 'warn',
  unconfigured: 'warn',
  'host-unavailable': 'bad',
  'auth-failed': 'bad',
  quota: 'bad',
  'rate-limited': 'warn',
  'model-not-found': 'bad',
  network: 'bad',
  timeout: 'warn',
  'bad-config': 'warn',
  empty: 'bad',
  filtered: 'bad',
  'upstream-failed': 'bad',
  aborted: 'warn'
};

function modelBinding() {
  var matches = [];
  try {
    var bindings = JSON.parse(localStorage.getItem('dsh.worktable.widgetBindings.v2') || '{}');
    var dir = String(projectDir() || '').replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
    if (!dir) return { sessionId: '', reason: 'none', matches: 0 };
    Object.keys(bindings).forEach(function (layoutId) {
      var panes = bindings[layoutId] || {};
      Object.keys(panes).forEach(function (paneId) {
        var row = panes[paneId];
        if (!row || !row.sessionId || row.enabled === false) return;
        var folder = String(row.folder || '').replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase();
        if (folder === dir) matches.push({ layoutId: layoutId, paneId: paneId, sessionId: String(row.sessionId) });
      });
    });
  } catch (e) {
    return { sessionId: '', reason: 'ambiguous', matches: 0, error: apiErrorMessage(e) };
  }
  // 当前 iframe 没有布局/窗格身份可反查；同目录只有一个明确绑定才使用，
  // 多个绑定绝不任取一个，统一回退 DSH 默认模型并说明原因。
  if (matches.length === 1) return { sessionId: matches[0].sessionId, reason: 'unique', matches: 1 };
  if (matches.length === 0) return { sessionId: '', reason: 'none', matches: 0 };
  return { sessionId: '', reason: 'ambiguous', matches: matches.length };
}
function modelBindingContext() {
  var b = modelBinding();
  APP.modelBinding = b;
  return { sessionId: b.sessionId || '', binding: b.reason || 'none' };
}
function modelBindingQuery() {
  var c = modelBindingContext();
  return 'sessionId=' + encodeURIComponent(c.sessionId) + '&binding=' + encodeURIComponent(c.binding);
}

function modelApi(path) {
  return '/api/medresearch/model' + path;
}

function modelStatusLabel(status) {
  return MODEL_STATUS_LABELS[status] || status || '未知状态';
}

function modelStatusClass(status) {
  return MODEL_STATUS_CLASS[status] || 'warn';
}

function modelChipHtml() {
  var m = APP.model || {};
  if (m.host === false) {
    return '<span class="statusChip bad click" data-act="modelSettings" title="宿主模型接口不可用；请安装/重启 dsh-medresearch-model 插件"><span class="dot"></span>模型接口不可用</span>';
  }
  if (m.loading || !m.mode) {
    return '<span class="statusChip warn click" data-act="modelSettings" title="正在读取模型设置"><span class="dot"></span>模型检测中</span>';
  }
  if (m.mode === 'custom') {
    var custom = m.custom || {};
    var ready = custom.hasKey && custom.model;
    return '<span class="statusChip ' + (ready ? 'ok' : 'warn') + ' click" data-act="modelSettings" title="' +
      esc(ready ? '自定义 API · ' + (custom.model || '') : '自定义 API 未配置完整') + '"><span class="dot"></span>' +
      (ready ? '自定义 API' : '模型未配置') + '</span>';
  }
  var dsh = m.dsh || {};
  var ok = dsh.available;
  var text = ok ? (dsh.source === 'session' ? 'DSH 模型' : 'DSH 默认模型') : '模型未配置';
  return '<span class="statusChip ' + (ok ? 'ok' : 'warn') + ' click" data-act="modelSettings" title="' +
    esc(ok ? dsh.label : (dsh.message || 'DSH 模型未配置')) + '"><span class="dot"></span>' + esc(text) + '</span>';
}

function modelRefresh(opts) {
  opts = opts || {};
  if (APP.modelSettingsOpen && !opts.force) return Promise.resolve(APP.model);
  if (!APP.model) APP.model = { loading: true, host: null };
  APP.model.loading = true;
  if (!APP.modelSettingsOpen) renderHead();
  return fetchJsonNice(modelApi('/settings?' + modelBindingQuery()), {}, 8000)
    .then(function (r) {
      if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
      APP.model = r.json;
      APP.model.host = true;
      APP.model.loading = false;
      APP.model.error = '';
      renderHead();
      if (APP.modelSettingsOpen && opts.paint !== false) paintModelDsh();
      return APP.model;
    })
    .catch(function (err) {
      APP.model.loading = false;
      APP.model.host = false;
      APP.model.error = apiErrorMessage(err);
      renderHead();
      if (APP.modelSettingsOpen && opts.paint !== false) paintModelDsh();
      return APP.model;
    });
}

function modelFormFromState() {
  var m = APP.model || {};
  var custom = m.custom || {};
  return {
    mode: m.mode === 'custom' ? 'custom' : 'dsh',
    provider: custom.provider || 'openai',
    baseURL: custom.baseURL || custom.defaultBaseURL || '',
    model: custom.model || '',
    apiKey: '',
    rememberKey: custom.rememberKey === true,
    dirty: false,
    testing: false
  };
}

function modelFieldHtml(label, html) {
  return '<div class="field"><label>' + esc(label) + '</label>' + html + '</div>';
}

function modelDshHtml() {
  var d = (APP.model && APP.model.dsh) || {};
  if (APP.model && APP.model.host === false) {
    return '<div class="banner bannerBad"><div class="grow"><b>宿主接口不可用</b><br>' + esc(APP.model.error || '请安装并重启 dsh-medresearch-model 宿主插件。') + '</div></div>';
  }
  if (!d.available) {
    return '<div class="banner bannerWarn"><div class="grow"><b>DSH 模型未配置</b><br>' + esc(d.message || '当前会话和 DSH 默认模型都没有可用选择。') + '</div></div>';
  }
  var src = d.source === 'session' ? '当前工作台明确绑定会话' : '使用 DSH 默认模型';
  var bindingText = d.bindingReason === 'ambiguous'
    ? '同目录存在多个绑定，无法唯一确定；已按默认模型回退，不任取一个。'
    : d.source === 'session'
      ? '当前工作台只有唯一匹配绑定；你在 DSH 切换模型后，下一次请求生效。'
      : d.bindingReason === 'none'
        ? '未找到当前工作台的明确绑定，明确按 DSH 默认模型使用。'
        : '未能可靠取得当前会话选择，明确按 DSH 默认模型使用。';
  return '<div class="modelInfoBox">' +
    '<div class="kv">' +
    '<div class="k">选择来源</div><div class="v">' + esc(src) + '</div>' +
    '<div class="k">Provider</div><div class="v mono">' + esc(d.provider || '—') + '</div>' +
    '<div class="k">Model</div><div class="v mono">' + esc(d.model || '—') + '</div>' +
    '<div class="k">推理设置</div><div class="v">' + esc(d.reasoningEffort || '未指定') + '</div>' +
    '<div class="k">说明</div><div class="v">' + esc(bindingText) + '</div>' +
    '</div>' +
    (d.sessionMissing ? '<div class="banner bannerWarn mt8"><div class="grow">工作台绑定会话当前未运行，已回退到 DSH 默认模型。</div></div>' : '') +
    (d.bindingReason === 'ambiguous' ? '<div class="banner bannerWarn mt8"><div class="grow"><b>多个绑定</b><br>未选择任何一个会话；将使用 DSH 默认模型。可关闭其他同目录工作台窗口后刷新。</div></div>' : '') +
    '</div>';
}

function modelStatusHtml() {
  var s = (APP.model && APP.model.status) || { status: 'untested', message: '尚未测试' };
  var status = APP.modelForm && APP.modelForm.testing ? 'testing' : (s.status || 'untested');
  var label = status === 'testing' ? '正在生成测试…' : modelStatusLabel(status);
  var when = s.at ? ' · ' + fmtDateTime(s.at) : '';
  var detail = s.message || '';
  return '<div class="modelStatusBox ' + (status === 'testing' ? 'warn' : modelStatusClass(status)) + '">' +
    '<div class="flex" style="justify-content:space-between"><b>' + esc(label) + esc(when) + '</b>' +
    (s.provider ? '<span class="chip mono">' + esc(s.provider + ' / ' + (s.model || '')) + '</span>' : '') + '</div>' +
    (detail ? '<div class="sub mt6">' + esc(detail) + '</div>' : '') +
    '</div>';
}

function paintModelStatus() {
  var box = $('#modelStatusBox');
  if (box) box.innerHTML = modelStatusHtml();
}
function modelInvalidateTest() {
  var s = (APP.model && APP.model.status) || {};
  if (s.status === 'untested' || s.status === 'testing') return;
  APP.model.status = { status: 'untested', at: 0, message: '配置已修改，需重新测试' };
  paintModelStatus();
}

function paintModelDsh() {
  var box = $('#modelDshBox');
  if (box) box.innerHTML = modelDshHtml();
  paintModelStatus();
}

function modelCustomHtml() {
  var f = APP.modelForm || modelFormFromState();
  var custom = (APP.model && APP.model.custom) || {};
  var provider = f.provider || 'openai';
  var defaults = { openai: 'https://api.openai.com/v1', deepseek: 'https://api.deepseek.com/v1', custom: '' };
  var base = f.baseURL || defaults[provider] || '';
  return '<div class="modelInfoBox">' +
    modelFieldHtml('服务商',
      '<select class="select" id="modelProvider" data-model-field="provider">' +
      '<option value="openai"' + (provider === 'openai' ? ' selected' : '') + '>OpenAI</option>' +
      '<option value="deepseek"' + (provider === 'deepseek' ? ' selected' : '') + '>DeepSeek</option>' +
      '<option value="custom"' + (provider === 'custom' ? ' selected' : '') + '>自定义 OpenAI 兼容服务</option>' +
      '</select>') +
    modelFieldHtml('API Base URL',
      '<input class="input" id="modelBaseURL" data-model-field="baseURL" placeholder="' + esc(defaults[provider] || 'https://api.example.com/v1') + '" value="' + esc(base) + '" />' +
      '<span class="hint">只支持 OpenAI 兼容的 /chat/completions；填到 /v1 或完整 /chat/completions 均可。</span>') +
    modelFieldHtml('模型名称',
      '<input class="input" id="modelName" data-model-field="model" placeholder="例如 gpt-4.1-mini / deepseek-chat" value="' + esc(f.model || '') + '" />' +
      '<span class="hint">模型名称不写死；以服务商实际模型 id 为准。</span>') +
    modelFieldHtml('API Key',
      '<input class="input" id="modelApiKey" data-model-field="apiKey" type="password" autocomplete="new-password" placeholder="' + esc(custom.hasKey ? '已保存；留空表示保留' : '输入 API Key') + '" value="" />' +
      '<span class="hint">密钥按“服务商 + 规范化 Base URL”隔离；更换平台或地址后不会沿用旧密钥，需为新地址填写。密钥只发给宿主后端，勾选“记住”后写入宿主凭据库，不进入页面 localStorage、数据文件或导出备份。</span>') +
    '<label class="checkRow"><input type="checkbox" id="modelRemember" data-model-field="rememberKey"' + (f.rememberKey ? ' checked' : '') + ' /> 在本机记住密钥（宿主凭据库）</label>' +
    '<div class="sub mt6">密钥状态：' + esc(custom.hasKey ? (custom.keySource === 'host-store' ? '已保存到宿主凭据库' : '已保存在本次进程内存') : '未配置') + '</div>' +
    (custom.hasKey ? '<div class="mt8"><button type="button" class="btnMini btnMiniDanger" data-act="modelClearKey">删除已保存密钥</button></div>' : '') +
    '<div class="banner mt10"><div class="grow">当前只支持 OpenAI 兼容 Chat Completions；Anthropic、Gemini 原生协议未实现。自定义设置不会修改 DSH 全局配置。</div></div>' +
    '</div>';
}

function openModelSettings() {
  APP.modelSettingsOpen = true;
  APP.modelForm = modelFormFromState();
  var body = '<div class="tabs" style="margin-bottom:10px">' +
    '<button type="button" class="tab ' + (APP.modelForm.mode === 'dsh' ? 'tabOn' : '') + '" data-act="modelMode" data-mode="dsh">使用 DSH 模型</button>' +
    '<button type="button" class="tab ' + (APP.modelForm.mode === 'custom' ? 'tabOn' : '') + '" data-act="modelMode" data-mode="custom">自定义 API</button>' +
    '</div>' +
    '<div id="modelDshPanel" style="display:' + (APP.modelForm.mode === 'dsh' ? 'block' : 'none') + '"><div id="modelDshBox">' + modelDshHtml() + '</div></div>' +
    '<div id="modelCustomPanel" style="display:' + (APP.modelForm.mode === 'custom' ? 'block' : 'none') + '"><div id="modelCustomBox">' + modelCustomHtml() + '</div></div>' +
    '<div class="divider"></div>' +
    '<div id="modelStatusBox">' + modelStatusHtml() + '</div>' +
    '<div class="flex mt10" style="flex-wrap:wrap">' +
    '<button type="button" class="btn" data-act="modelRefresh">刷新状态</button>' +
    '<button type="button" class="btn" data-act="modelSave">保存</button>' +
    '<button type="button" class="btn btnPrimary" data-act="modelTest">测试生成</button>' +
    '<button type="button" class="btn" data-act="modelClear">清除配置</button>' +
    '</div>' +
    '<div class="sub mt8">测试生成会真实调用付费模型；只有取得有效回答才算成功。定时状态检查只读取设置，不调用模型。</div>' +
    '<div id="modelDirty" class="muted mt6"></div>';
  openModal({ title: '模型设置', body: body, hideSubmit: true, focus: false });
  setTimeout(function () { paintModelStatus(); }, 0);
  modelRefresh({ force: true, paint: true });
}

function setModelMode(mode) {
  if (!APP.modelForm) APP.modelForm = modelFormFromState();
  var nextMode = mode === 'custom' ? 'custom' : 'dsh';
  var changed = APP.modelForm.mode !== nextMode;
  APP.modelForm.mode = nextMode;
  if (changed) {
    APP.modelForm.dirty = true;
    modelInvalidateTest();
  }
  document.querySelectorAll('[data-act="modelMode"]').forEach(function (b) {
    b.classList.toggle('tabOn', b.getAttribute('data-mode') === APP.modelForm.mode);
  });
  var d = $('#modelDshPanel'), c = $('#modelCustomPanel');
  if (d) d.style.display = APP.modelForm.mode === 'dsh' ? 'block' : 'none';
  if (c) c.style.display = APP.modelForm.mode === 'custom' ? 'block' : 'none';
  var dirty = $('#modelDirty');
  if (dirty) dirty.textContent = changed ? '模式已更改，点击“保存”后生效。' : '';
}

function modelCollectForm() {
  var f = APP.modelForm || modelFormFromState();
  var provider = $('#modelProvider');
  var base = $('#modelBaseURL');
  var name = $('#modelName');
  var key = $('#modelApiKey');
  var remember = $('#modelRemember');
  return {
    mode: f.mode,
    provider: provider ? provider.value : f.provider,
    baseURL: base ? base.value : f.baseURL,
    model: name ? name.value : f.model,
    apiKey: key ? key.value : '',
    rememberKey: remember ? remember.checked : f.rememberKey,
    ...modelBindingContext()
  };
}

function modelSave(opts) {
  opts = opts || {};
  var body = modelCollectForm();
  if (body.mode === 'custom' && !String(body.model || '').trim()) {
    toast('请填写模型名称');
    return Promise.resolve(false);
  }
  if (body.mode === 'custom' && !String(body.baseURL || '').trim() && body.provider === 'custom') {
    toast('请填写 API Base URL');
    return Promise.resolve(false);
  }
  return fetchJsonNice(modelApi('/save'), {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body)
  }, 12000).then(function (r) {
    if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
    var wasTesting = !!(APP.modelForm && APP.modelForm.testing);
    APP.model = r.json;
    APP.model.host = true;
    APP.model.loading = false;
    APP.modelForm = modelFormFromState();
    APP.modelForm.testing = wasTesting;
    renderHead();
    var customBox = $('#modelCustomBox');
    if (customBox && APP.modelForm.mode === 'custom') customBox.innerHTML = modelCustomHtml();
    paintModelDsh();
    var dirty = $('#modelDirty');
    if (dirty) dirty.textContent = '已保存；请点“测试生成”验证。';
    if (!opts.silent) toast('模型设置已保存');
    return true;
  }).catch(function (err) {
    var dirty = $('#modelDirty');
    if (dirty) dirty.textContent = '保存失败：' + apiErrorMessage(err);
    toast('保存失败：' + apiErrorMessage(err));
    return false;
  });
}

function modelTest() {
  if (!APP.modelForm) APP.modelForm = modelFormFromState();
  if (APP.modelForm.testing) return Promise.resolve();
  APP.modelForm.testing = true;
  paintModelStatus();
  return modelSave({ silent: true }).then(function (saved) {
    if (!saved) {
      APP.modelForm.testing = false;
      paintModelStatus();
      return;
    }
    return fetchJsonNice(modelApi('/test'), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(modelBindingContext())
    }, 70000).then(function (r) {
      if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
      var j = r.json || {};
      APP.model.status = {
        status: j.status || (j.ok ? 'success' : 'upstream-failed'),
        at: j.at || Date.now(),
        message: j.message || '',
        provider: j.provider || '',
        model: j.model || '',
        source: j.source || ''
      };
      APP.modelForm.testing = false;
      paintModelStatus();
      renderHead();
      toast(j.ok ? '测试生成成功' : '测试未通过：' + (j.message || j.status || '未知原因'));
    });
  }).catch(function (err) {
    APP.modelForm.testing = false;
    APP.model.status = { status: 'network', at: Date.now(), message: apiErrorMessage(err) };
    paintModelStatus();
    toast('测试失败：' + apiErrorMessage(err));
  }).finally(function () {
    if (APP.modelForm) APP.modelForm.testing = false;
    paintModelStatus();
  });
}

function modelClear() {
  if (!window.confirm('清除自定义模型配置和已保存密钥？DSH 全局配置不会被修改。')) return;
  fetchJsonNice(modelApi('/clear'), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(modelBindingContext()) }, 12000)
    .then(function (r) {
      if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
      APP.model = r.json;
      APP.model.host = true;
      APP.modelForm = modelFormFromState();
      renderHead();
      var customBox = $('#modelCustomBox');
      if (customBox) customBox.innerHTML = modelCustomHtml();
      paintModelDsh();
      toast('已清除模型配置');
    })
    .catch(function (err) { toast('清除失败：' + apiErrorMessage(err)); });
}

function modelClearKey() {
  if (!window.confirm('删除已保存的自定义 API Key？')) return;
  fetchJsonNice(modelApi('/clear-key'), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(modelBindingContext()) }, 12000)
    .then(function (r) {
      if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
      APP.model = r.json;
      APP.model.host = true;
      var key = $('#modelApiKey');
      if (key) key.value = '';
      var customBox = $('#modelCustomBox');
      if (customBox) customBox.innerHTML = modelCustomHtml();
      renderHead();
      paintModelDsh();
      toast('已删除保存的密钥');
    })
    .catch(function (err) { toast('删除密钥失败：' + apiErrorMessage(err)); });
}

function askHostModel(payload) {
  if (APP.model && APP.model.host === false) {
    return Promise.reject(new Error('宿主模型接口不可用；请安装/重启 dsh-medresearch-model 插件。'));
  }
  var body = Object.assign({}, payload, modelBindingContext());
  return fetchJsonNice(modelApi('/ask'), {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body)
  }, 70000).then(function (r) {
    if (!r.ok) {
      var msg = (r.json && r.json.error && r.json.error.message) || ('模型调用失败 HTTP ' + r.status);
      if (r.status === 403) msg = '宿主模型接口拒绝访问；请从 DSH 工作台窗口打开。';
      var err = new Error(msg);
      err.code = r.json && r.json.error && r.json.error.code;
      err.status = r.status;
      throw err;
    }
    if (!r.json || !r.json.ok || !r.json.answer) throw new Error('模型返回空回答');
    return r.json;
  });
}

document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (!el || !el.getAttribute || !el.getAttribute('data-model-field')) return;
  if (!APP.modelForm) APP.modelForm = modelFormFromState();
  var field = el.getAttribute('data-model-field');
  APP.modelForm[field] = el.type === 'checkbox' ? el.checked : el.value;
  APP.modelForm.dirty = true;
  modelInvalidateTest();
  var dirty = $('#modelDirty');
  if (dirty) dirty.textContent = '有未保存修改；测试生成会先保存。';
});

document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (!el || !el.id) return;
  if (el.id === 'modelProvider') {
    if (!APP.modelForm) APP.modelForm = modelFormFromState();
    APP.modelForm.provider = el.value;
    APP.modelForm.dirty = true;
    modelInvalidateTest();
    var base = $('#modelBaseURL');
    if (base) {
      var defaults = { openai: 'https://api.openai.com/v1', deepseek: 'https://api.deepseek.com/v1', custom: '' };
      base.value = defaults[el.value] || '';
      base.placeholder = defaults[el.value] || 'https://api.example.com/v1';
      APP.modelForm.baseURL = base.value;
    }
    var customBox = $('#modelCustomBox');
    if (customBox) customBox.innerHTML = modelCustomHtml();
    var dirty = $('#modelDirty');
    if (dirty) dirty.textContent = '服务商已更改；请确认地址与模型后保存。';
  }
});



</script>
<script>
/* ===== views.js ===== */
  /* ================================================================
     状态条 / 保存失败提示
     ================================================================ */
  function updateSaveBanner() {
    var show = APP.save.mode === 'local' || !!APP.save.error;
    var el = $('#saveWarn');
    if (!show) { if (el) el.remove(); return; }
    if (!el) {
      el = document.createElement('div');
      el.id = 'saveWarn';
      el.className = 'saveWarn';
      document.body.appendChild(el);
    }
    el.innerHTML = '<span class="dot"></span><span class="grow">' + (APP.save.error
      ? '保存到文件失败：' + esc(APP.save.error) + '。内容已保留在浏览器，可重试。'
      : '当前仅保存在浏览器（未写入项目文件）。启动本地服务或检查权限后可写入文件。') + '</span><button type="button" class="btn btnMini" data-act="retrySave">重试保存</button>';
  }
  function saveModeText() {
    if (APP.save.mode === 'bridge') return '本机数据文件（桥接）';
    if (APP.save.mode === 'worktable') return '工作台项目文件';
    return '浏览器 localStorage';
  }
  function bridgeStatusChip() {
    if (APP.bridge.probing) return '<span class="statusChip warn"><span class="dot"></span>检测中</span>';
    return APP.bridge.online
      ? '<span class="statusChip ok"><span class="dot"></span>已连接</span>'
      : '<span class="statusChip bad"><span class="dot"></span>未连接</span>';
  }
  function zoteroStatusChip() {
    var z = APP.bridge.online && APP.bridge.health && APP.bridge.health.zotero;
    if (!APP.bridge.online) return '<span class="statusChip"><span class="dot"></span>需本地服务</span>';
    if (!z) return '<span class="statusChip warn"><span class="dot"></span>未知</span>';
    return z.connected
      ? '<span class="statusChip ok"><span class="dot"></span>已连接</span>'
      : '<span class="statusChip warn"><span class="dot"></span>未检测到</span>';
  }
  function modelStatusChip() {
    var m = APP.model || {};
    if (m.host === false) return '<span class="statusChip bad click" data-act="modelSettings"><span class="dot"></span>宿主接口不可用</span>';
    if (m.mode === 'custom') {
      var c = m.custom || {};
      return c.hasKey && c.model
        ? '<span class="statusChip ok click" data-act="modelSettings"><span class="dot"></span>自定义 API · ' + esc(c.model) + '</span>'
        : '<span class="statusChip warn click" data-act="modelSettings"><span class="dot"></span>自定义 API 未配置</span>';
    }
    var d = m.dsh || {};
    return d.available
      ? '<span class="statusChip ok click" data-act="modelSettings"><span class="dot"></span>' + esc(d.source === 'session' ? '跟随会话 · ' + d.model : 'DSH 默认模型 · ' + d.model) + '</span>'
      : '<span class="statusChip warn click" data-act="modelSettings"><span class="dot"></span>DSH 模型未配置</span>';
  }
  function biomcpStatusChip() {
    var b = APP.bridge.online && APP.bridge.health && APP.bridge.health.search && APP.bridge.health.search.biomcp;
    if (b && b.installed) return '<span class="statusChip ok"><span class="dot"></span>BioMCP ' + esc(b.version || '') + ' 可运行</span>';
    if (!APP.bridge.online) return '<span class="statusChip"><span class="dot"></span>页面直连上游</span>';
    return '<span class="statusChip warn"><span class="dot"></span>' + (b && b.found ? 'BioMCP 启动失败' : 'BioMCP 未找到') + ' · 备用检索</span>';
  }

  /* ================================================================
     通用片段
     ================================================================ */
  function demoCount() {
    return APP.data.items.filter(function (x) { return x.demo; }).length +
      APP.data.topics.filter(function (x) { return x.demo; }).length +
      APP.data.notes.filter(function (x) { return x.demo; }).length +
      APP.data.tasks.filter(function (x) { return x.demo; }).length +
      APP.data.cases.filter(function (x) { return x.demo; }).length;
  }
  function demoBanner() {
    var n = demoCount();
    if (!n) return '';
    return '<div class="banner bannerWarn"><div class="grow"><b>当前含演示数据</b>（' + n + ' 条，均带「演示」标记）。演示条目仅用于展示结构与交互，不代表真实临床结论；清除演示数据不会影响你新增的真实资料。</div><button type="button" class="btn btnMini" data-act="demoClear">清除演示数据</button></div>';
  }
  function pageHead(title, sub, actions) {
    return '<div class="pageHead"><div><h2 class="pageTitle">' + esc(title) + '</h2>' + (sub ? '<p class="pageSub">' + sub + '</p>' : '') + '</div><div class="pageActions">' + (actions || '') + '</div></div>';
  }
  function statusPill(status) {

  /* ================================================================

     ================================================================ */
  function filteredItems() {
    var f = APP.ui.library;
    var q = str(f.q).toLowerCase();
    return APP.data.items.filter(function (it) {
      if (f.star && !it.starred) return false;
      if (f.type && it.type !== f.type) return false;
      if (f.status && it.readStatus !== f.status) return false;
      if (f.topic && it.topicIds.indexOf(f.topic) < 0) return false;
      if (f.tag && it.tags.indexOf(f.tag) < 0) return false;
      if (q) {
        var hay = [it.title, it.abstract, it.journal, it.doi, it.pmid, (it.authors || []).join(' '), (it.tags || []).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    }).sort(function (a, b) {
      if (f.sort === 'added') return b.addedAt - a.addedAt;
      if (f.sort === 'year') return (b.year || '0').localeCompare(a.year || '0');
      if (f.sort === 'title') return a.title.localeCompare(b.title, 'zh-CN');
      if (f.sort === 'read') return (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0);
      return (b.lastOpenedAt || b.addedAt) - (a.lastOpenedAt || a.addedAt);
    });
  }
  function libraryRowHtml(it) {
    var tags = it.tags.slice(0, 3).map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('');
    return '<tr>' +

      '<td><div class="cellTitle" data-act="openItem" data-id="' + it.id + '">' + esc(it.title) + '</div><div class="cellSub">' + esc(itemMetaLine(it)) + (it.demo ? '<span class="chip chipWarn">演示</span>' : '') + (it.sample ? '<span class="chip chipTeal">示例 PDF</span>' : '') + '</div><div class="chips" style="margin-top:4px">' + itemTopicChips(it) + tags + '</div></td>' +
      '<td><div class="chips">' + idChips(it) + '</div><div class="muted" style="margin-top:4px">' + sourceChip(it) + '</div></td>' +

  async function zoteroSearch() {
    var box = $('#zoteroResults');
    var q = $('#zoteroQ') ? $('#zoteroQ').value : '';
    if (!box) return;
    box.innerHTML = '<div class="loadingRow"><span class="spin"></span>正在读取 Zotero 本地库…</div>';
    try {
      var r = await fetchJsonNice(APP.bridge.url + '/zotero/search?q=' + encodeURIComponent(q) + '&limit=30&mode=everything', {}, 15000);
      if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
      var items = (r.json && r.json.items) || [];
      if (!items.length) {
        box.innerHTML = '<div class="empty">Zotero 中没有匹配的条目。确认本地库已建立索引，或换一个关键词。</div>';
        return;
      }
      box.innerHTML = '<div class="muted" style="margin-bottom:6px">共 ' + items.length + ' 条（最多显示 30 条）</div>' + items.map(function (it) {
        return '<div class="listRow"><div class="listRowMain"><div class="rowTitle">' + esc(it.title) + '</div><div class="rowMeta"><span>' + esc(it.authors.slice(0, 3).join(', ') || '未知作者') + '</span><span>' + esc(it.year || '') + '</span>' + (it.journal ? '<span>' + esc(it.journal) + '</span>' : '') + (it.doi ? '<span class="mono">DOI ' + esc(it.doi) + '</span>' : '') + (it.pmid ? '<span class="mono">PMID ' + esc(it.pmid) + '</span>' : '') + '<span class="chip chipTeal">Zotero ' + esc(it.zoteroKey) + '</span></div></div><div class="rowOps"><button class="btnMini" data-act="zoteroImport" data-key="' + esc(it.zoteroKey) + '">导入</button></div></div>';
      }).join('');
    } catch (err) {
      box.innerHTML = '<div class="banner bannerBad"><div class="grow">读取 Zotero 失败：' + esc(apiErrorMessage(err)) + '</div><button class="btn btnMini" data-act="zoteroSearch">重试</button></div>';
    }
  }
  async function importZoteroItem(key) {
    if (!key) return;
    toast('正在读取 Zotero 条目…');
    try {
      var r = await fetchJsonNice(APP.bridge.url + '/zotero/item?key=' + encodeURIComponent(key), {}, 20000);
      if (!r.ok) throw new Error((r.json && r.json.error && r.json.error.message) || ('HTTP ' + r.status));
      var z = r.json.item;
      var pdf = (z.children.attachments || []).filter(function (a) { return /pdf/i.test(a.contentType) || /\.pdf$/i.test(a.filename); })[0];
      var res = upsertItem({
        title: z.title,
        type: z.zoteroItemType === 'journalArticle' ? '期刊文献' : z.zoteroItemType === 'conferencePaper' ? '会议摘要' : '其他',
        authors: z.authors,
        year: z.year,
        journal: z.journal,
        doi: z.doi,
        pmid: z.pmid,
        abstract: z.abstract,
        url: z.url,
        zoteroKey: z.zoteroKey,
        zoteroRef: z.zoteroRef,
        zoteroItemType: z.zoteroItemType,
        attachmentKey: pdf ? pdf.key : '',
        tags: z.tags,
        annotations: (z.children.annotations || []).map(function (a) {
          return {
            id: uid('an'), page: a.page, quote: a.text, comment: a.comment, color: a.color,
            origin: 'user', source: 'zotero', zoteroKey: a.key || '', createdAt: Date.now()
          };
        }),
        topicIds: APP.zoteroTopicId ? [APP.zoteroTopicId] : [],
        source: { type: 'zotero', label: 'Zotero 本地库', at: Date.now() }
      });
      var importedNotes = 0;
      (z.children.notes || []).forEach(function (n) {
        if (!n.body) return;
        var duplicate = APP.data.notes.some(function (x) { return x.itemId === res.item.id && x.body === n.body; });
        if (duplicate) return;
        APP.data.notes.unshift(normalizeNote({
          body: n.body,
          itemId: res.item.id,
          origin: 'user',
          tags: ['Zotero']
        }));
        importedNotes++;
      });
      markDirty({ immediate: true });
      closeModal();
      render();
      toast('已导入：' + truncate(z.title, 30) + '（批注 ' + (z.children.annotations || []).length + ' 条，笔记 ' + importedNotes + ' 条）');
    } catch (err) {
      toast('导入失败：' + apiErrorMessage(err));
    }
  }

  async function syncFromBridge() {

      var r = await fetchJsonNice(APP.bridge.url + '/data/load', {}, 6000);

        var remote = normalizeState(r.json);
        if (remote.updatedAt > APP.data.updatedAt) {
          if (window.confirm('本机数据文件比当前窗口更新。是否载入文件中的数据？')) {
            APP.data = remote;
            writeLocalState();
            render();
            toast('已载入本机文件数据');

          saveNow('settings-sync');

  async function exportBackup() {

      try { await fetchJsonNice(APP.bridge.url + '/data/backup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ label: 'manual' }) }, 8000); } catch (e) {}
    }
